    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- FORMATTERS ---
        const formatDateShort = (dateStr) => {
            if (!dateStr) return '';
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                const [y, m, d] = dateStr.split('-');
                const date = new Date(y, m - 1, d);
                const options = { weekday: 'long', month: 'long', day: 'numeric' };
                let res = date.toLocaleDateString('es-ES', options).replace(',', '');
                return res.charAt(0).toUpperCase() + res.slice(1);
            }
            return dateStr;
        };

        const formatTimeOnly = (timeStr) => {
            if (!timeStr) return '';
            if (/^\d{2}:\d{2}$/.test(timeStr)) {
                let [h, m] = timeStr.split(':');
                let hour = parseInt(h, 10);
                hour = hour % 12 || 12;
                return `${hour}:${m}`;
            }
            return timeStr;
        };

        const formatDateText = (dateStr) => {
            if (!dateStr) return '';
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                const [y, m, d] = dateStr.split('-');
                const date = new Date(y, m - 1, d);
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                let res = date.toLocaleDateString('es-ES', options);
                return res.charAt(0).toUpperCase() + res.slice(1);
            }
            return dateStr;
        };

        const formatTimeText = (timeStr) => {
            if (!timeStr) return '';
            if (/^\d{2}:\d{2}$/.test(timeStr)) {
                let [h, m] = timeStr.split(':');
                let hour = parseInt(h, 10);
                const ampm = hour >= 12 ? 'p.m.' : 'a.m.';
                hour = hour % 12 || 12;
                return `${hour}:${m} ${ampm}`;
            }
            return timeStr;
        };

        const formatPlayerName = (player, isAdmin) => {
            let name = `${player.name} ${player.lastName ? (isAdmin ? player.lastName : player.lastName.charAt(0) + '.') : ''}`;
            if (player.alias) name += ` "${player.alias}"`;
            return name;
        };

        // --- UTILS ---
        const captureAndDownload = async (elementId, fileName, setDownloading) => {
            if (!window.html2canvas) return;
            setDownloading(true);
            
            await new Promise(r => setTimeout(r, 100));
            
            try {
                const element = document.getElementById(elementId);
                const canvas = await window.html2canvas(element, {
                    scale: 3,
                    useCORS: true,
                    backgroundColor: '#1c1917'
                });
                const link = document.createElement("a");
                link.href = canvas.toDataURL("image/png");
                link.download = `${fileName}_${new Date().getTime()}.png`;
                link.click();
            } catch (err) {
                console.error("Error al exportar la imagen", err);
            }
            setDownloading(false);
        };

        function PlayerAvatar({ player, className = "w-10 h-10 text-sm" }) {

        function ImageCropperModal({ file, onCropped, onCancel }) {
            const [src, setSrc] = useState(null);
            const canvasRef = useRef(null);
            const imgRef = useRef(null);
            const [scale, setScale] = useState(1);
            const [pos, setPos] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [startPos, setStartPos] = useState({ x: 0, y: 0 });

            useEffect(() => {
                if (file) {
                    const reader = new FileReader();
                    reader.onload = e => setSrc(e.target.result);
                    reader.readAsDataURL(file);
                }
            }, [file]);

            const onImageLoad = (e) => {
                const { naturalWidth, naturalHeight } = e.target;
                const initialScale = Math.max(256 / naturalWidth, 256 / naturalHeight);
                setScale(initialScale);
                setPos({
                    x: (256 - naturalWidth * initialScale) / 2,
                    y: (256 - naturalHeight * initialScale) / 2
                });
            };

            const handleCrop = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const img = imgRef.current;
                
                canvas.width = 256;
                canvas.height = 256;
                
                ctx.clearRect(0, 0, 256, 256);
                
                const drawWidth = img.naturalWidth * scale;
                const drawHeight = img.naturalHeight * scale;
                
                ctx.drawImage(img, pos.x, pos.y, drawWidth, drawHeight);
                onCropped(canvas.toDataURL('image/jpeg', 0.9));
            };

            if (!src) return null;

            return (
                <Modal isOpen={true} onClose={onCancel} title="Recortar Imagen">
                    <div className="flex flex-col items-center space-y-6 overflow-hidden">
                        <p className="text-stone-400 text-sm text-center">Arrastra la imagen y ajusta el zoom para centrar tu rostro en la cuadrícula.</p>
                        <div 
                            className="relative bg-stone-900 border-2 border-dashed border-stone-500 rounded-full overflow-hidden cursor-move touch-none shadow-inner"
                            style={{ width: '256px', height: '256px', boxSizing: 'content-box' }}
                            onMouseDown={e => { setIsDragging(true); setStartPos({ x: e.clientX - pos.x, y: e.clientY - pos.y }); }}
                            onMouseMove={e => { if (isDragging) setPos({ x: e.clientX - startPos.x, y: e.clientY - startPos.y }); }}
                            onMouseUp={() => setIsDragging(false)}
                            onMouseLeave={() => setIsDragging(false)}
                            onTouchStart={e => { setIsDragging(true); setStartPos({ x: e.touches[0].clientX - pos.x, y: e.touches[0].clientY - pos.y }); }}
                            onTouchMove={e => { if (isDragging) setPos({ x: e.touches[0].clientX - startPos.x, y: e.touches[0].clientY - startPos.y }); }}
                            onTouchEnd={() => setIsDragging(false)}
                        >
                            <img 
                                ref={imgRef}
                                src={src} 
                                onLoad={onImageLoad}
                                alt="Crop preview" 
                                style={{ 
                                    transform: `translate(${pos.x}px, ${pos.y}px) scale(${scale})`, 
                                    transformOrigin: 'top left',
                                    pointerEvents: 'none',
                                    maxWidth: 'none'
                                }} 
                            />
                            <div className="absolute inset-0 pointer-events-none flex items-center justify-center z-10">
                                <div className="w-full h-[1px] bg-white/40"></div>
                                <div className="h-full w-[1px] bg-white/40 absolute"></div>
                                <div className="w-3/4 h-3/4 border-2 border-white/30 rounded-full absolute"></div>
                            </div>
                        </div>
                        <div className="w-full flex items-center gap-3">
                            <i className="ph-fill ph-image text-stone-500 text-xl"></i>
                            <input type="range" min="0.05" max="3" step="0.01" value={scale} onChange={e => setScale(parseFloat(e.target.value))} className="w-full accent-pitch-500" />
                            <i className="ph-fill ph-magnifying-glass-plus text-stone-500 text-xl"></i>
                        </div>
                        <div className="flex gap-2 w-full pt-2 border-t border-stone-700">
                            <button onClick={onCancel} className="flex-1 bg-stone-700 hover:bg-stone-600 py-3 rounded-lg text-white font-semibold transition-colors">Cancelar</button>
                            <button onClick={handleCrop} className="flex-1 bg-pitch-600 hover:bg-pitch-500 py-3 rounded-lg text-white font-bold transition-colors">Aplicar Recorte</button>
                        </div>
                        <canvas ref={canvasRef} className="hidden" />
                    </div>
                </Modal>
            );
        }

                                    {yapeCopied ? <><i className="ph-bold ph-check text-pitch-400"></i> <span className="text-pitch-400">¡Copiado!</span></> : <><i className="ph-bold ph-copy"></i> Yape: 918 508 591</>}
                                </button>

        }

        function CurrentRosterSection({ currentMatch, updateCurrentMatch, computedPlayers, isAdmin }) {
            const [showAddModal, setShowAddModal] = useState(false);
            const [searchTerm, setSearchTerm] = useState("");
            const [copyFeedback, setCopyFeedback] = useState(false);
            const [isDownloading, setIsDownloading] = useState(false);

            if (!currentMatch) return null;

            const attendeesMap = currentMatch.attendees || {};
            const isCompleted = currentMatch.status === 'completed';

            const convocadosList = computedPlayers.filter(p => attendeesMap[p.id] && attendeesMap[p.id] !== 'none');
            const noConvocadosList = computedPlayers.filter(p => !attendeesMap[p.id] || attendeesMap[p.id] === 'none');

            const filteredNoConvocados = noConvocadosList.filter(p => 
                p.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                (p.lastName && p.lastName.toLowerCase().includes(searchTerm.toLowerCase())) ||
                (p.alias && p.alias.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            const totalCollected = convocadosList.reduce((sum, p) => {
                if (attendeesMap[p.id] === 'full') return sum + Number(currentMatch.quota);
                if (attendeesMap[p.id] === 'half') return sum + (Number(currentMatch.quota) / 2);
                return sum;
            }, 0);

            const handleStatusChange = (playerId, newStatus) => {
                const newAttendees = { ...attendeesMap };
                if (newStatus === 'none') delete newAttendees[playerId];
                else newAttendees[playerId] = newStatus;
                updateCurrentMatch({ ...currentMatch, attendees: newAttendees });
            };

            const handleCopyNumbers = () => {
                const textToCopy = convocadosList
                    .filter(p => p.phone)
                    .map(p => `${p.name} ${p.lastName || ''} - ${p.phone}`)
                    .join('\n');
                
                if (textToCopy) {
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        setCopyFeedback(true);
                        setTimeout(() => setCopyFeedback(false), 2000);
                    }).catch(() => {
                        const textArea = document.createElement("textarea");
                        textArea.value = textToCopy;
                        document.body.appendChild(textArea);
                        textArea.select();
                        try {
                            document.execCommand('copy');
                            setCopyFeedback(true);
                            setTimeout(() => setCopyFeedback(false), 2000);
                        } catch (err) {}
                        document.body.removeChild(textArea);
                    });
                }
            };

            return (
                <section id="roster-capture-area" className="bg-stone-800 rounded-2xl p-3 sm:p-6 shadow-xl border border-stone-700/50 relative">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 sm:mb-6 gap-3 sm:gap-4">
                        <div>
                            <h2 className="text-lg sm:text-2xl font-bold text-white flex items-center gap-2">
                                <i className="ph-fill ph-users-three text-pitch-400"></i> Convocados
                            </h2>
                            <p className="text-stone-400 text-[10px] sm:text-sm mt-0.5">
                                {convocadosList.length} Chocolateros {isAdmin && <span>• Recaudado: <span className="text-pitch-400 font-bold">S/ {totalCollected.toFixed(2)}</span></span>}
                            </p>
                        </div>
                        <div className="flex flex-wrap gap-1.5 sm:gap-2 w-full sm:w-auto" data-html2canvas-ignore="true">
                            {isAdmin && (
                                <button onClick={handleCopyNumbers} className="flex-1 sm:flex-none bg-blue-900/50 hover:bg-blue-800/80 text-blue-300 px-2 sm:px-4 py-1.5 sm:py-2 rounded-lg font-semibold flex items-center justify-center gap-1.5 transition-colors border border-blue-900 text-[10px] sm:text-sm">
                                    {copyFeedback ? <><i className="ph-fill ph-check"></i> Copiados</> : <><i className="ph ph-copy"></i> N°s</>}
                                </button>
                            )}
                            {isAdmin && !isCompleted && (
                                <button onClick={() => setShowAddModal(true)} className="flex-[2] sm:flex-none bg-stone-700 hover:bg-stone-600 text-white px-2 sm:px-4 py-1.5 sm:py-2 rounded-lg font-semibold flex items-center justify-center gap-1.5 transition-colors border border-stone-600 text-[10px] sm:text-sm">
                                    <i className="ph ph-user-plus"></i> Armar Lista
                                </button>
                            )}
                            {isAdmin && isCompleted && (
                                <div className="flex-[2] sm:flex-none bg-pitch-900/50 text-pitch-400 px-2 sm:px-4 py-1.5 sm:py-2 rounded-lg font-semibold flex items-center justify-center gap-1.5 border border-pitch-900 text-[10px] sm:text-sm text-center leading-tight">
                                    <i className="ph-fill ph-check-circle"></i> Partido Finalizado
                                </div>
                            )}
                            {isAdmin && (
                                <button onClick={() => captureAndDownload('roster-capture-area', `Convocados_${currentMatch.date}`, setIsDownloading)} className="flex-1 sm:flex-none bg-pitch-600 hover:bg-pitch-500 text-white px-2 sm:px-4 py-1.5 sm:py-2 rounded-lg font-semibold flex items-center justify-center gap-1.5 transition-colors shadow-md text-[10px] sm:text-sm">
                                    {isDownloading ? <i className="ph ph-spinner animate-spin"></i> : <i className="ph ph-download-simple"></i>} JPG
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-2 gap-2 sm:gap-3">
                        {convocadosList.map(player => {
                            const status = attendeesMap[player.id];
                            return (
                                <div key={player.id} className="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-stone-900 p-2 sm:p-3 rounded-xl border border-stone-700 gap-2">
                                    <div className="flex items-center gap-2 min-w-0 w-full sm:w-auto">
                                        <PlayerAvatar player={player} className="w-8 h-8 sm:w-10 sm:h-10 text-xs shrink-0" />
                                        <div className="min-w-0 flex-1">
                                            <p className="font-semibold text-stone-100 text-[10px] sm:text-base truncate">
                                                {formatPlayerName(player, isAdmin)}
                                            </p>
                                            {isAdmin && player.phone && <p className="text-[8px] sm:text-xs text-stone-500 font-mono truncate" data-html2canvas-ignore="true"><i className="ph ph-whatsapp logo text-pitch-500"></i> {player.phone}</p>}
                                        </div>
                                    </div>

                                    {isAdmin && !isCompleted ? (
                                        <select value={status} onChange={(e) => handleStatusChange(player.id, e.target.value)} className="bg-stone-800 text-[8px] sm:text-sm border border-stone-600 rounded-md p-1 focus:border-pitch-500 outline-none text-stone-200 shrink-0 w-full sm:w-auto">
                                            <option className="bg-stone-900 text-white" value="full">✔️ Completo</option>
                                            <option className="bg-stone-900 text-white" value="half">🌗 Medio</option>
                                            <option className="bg-stone-900 text-white" value="free">🎁 Gratis</option>
                                            <option className="bg-stone-900 text-white" value="pending_payment">🔴 Falta pago</option>
                                            <option className="bg-stone-900 text-white" value="absent">❌ Faltó</option>
                                            <option className="bg-stone-900 text-white" value="excused">🏥 Justif.</option>
                                            <option className="bg-stone-900 text-red-400 font-semibold" value="none">🗑️ Quitar</option>
                                        </select>
                                    ) : (
                                        <div className="text-[8px] sm:text-sm font-medium shrink-0 w-full sm:w-auto flex justify-start sm:justify-end">
                                            {status === 'full' && <span className="text-pitch-400 bg-pitch-400/10 px-1 py-0.5 sm:px-2 sm:py-1 rounded border border-pitch-400/20 flex items-center gap-1 w-full sm:w-auto justify-center"><i className="ph-fill ph-check-circle"></i> <span className="hidden sm:inline">Va Completo</span><span className="sm:hidden">Full</span></span>}
                                            {status === 'half' && <span className="text-gold bg-gold/10 px-1 py-0.5 sm:px-2 sm:py-1 rounded border border-gold/20 flex items-center gap-1 w-full sm:w-auto justify-center"><i className="ph-fill ph-star-half"></i> <span className="hidden sm:inline">Medio Cupo</span><span className="sm:hidden">Mitad</span></span>}
                                            {status === 'free' && <span className="text-blue-400 bg-blue-400/10 px-1 py-0.5 sm:px-2 sm:py-1 rounded border border-blue-400/20 flex items-center gap-1 w-full sm:w-auto justify-center"><i className="ph-fill ph-gift"></i> <span className="hidden sm:inline">Invitado</span><span className="sm:hidden">Free</span></span>}
                                            {status === 'pending_payment' && <span className="text-red-400 bg-red-400/10 px-1 py-0.5 sm:px-2 sm:py-1 rounded border border-red-400/20 flex items-center gap-1 w-full sm:w-auto justify-center"><i className="ph-fill ph-warning-circle"></i> <span className="hidden sm:inline">Falta Adelantar</span><span className="sm:hidden">Debe</span></span>}
                                            {status === 'absent' && <span className="text-red-400 bg-red-400/10 px-1 py-0.5 sm:px-2 sm:py-1 rounded border border-red-400/20 flex items-center gap-1 w-full sm:w-auto justify-center"><i className="ph-fill ph-x-circle"></i> Faltó</span>}
                                            {status === 'excused' && <span className="text-stone-400 bg-stone-400/10 px-1 py-0.5 sm:px-2 sm:py-1 rounded border border-stone-400/20 flex items-center gap-1 w-full sm:w-auto justify-center"><i className="ph-fill ph-first-aid"></i> <span className="hidden sm:inline">Justificado</span><span className="sm:hidden">Justif.</span></span>}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                        {convocadosList.length === 0 && (
                            <div className="col-span-2 text-center py-10 border-2 border-dashed border-stone-700 rounded-xl bg-stone-900/50">
                                <i className="ph ph-users-three text-4xl sm:text-5xl text-stone-600 mb-3 block"></i>
                                <p className="text-stone-400 font-medium text-sm sm:text-lg">Aún no hay convocados en la lista oficial.</p>
                            </div>
                        )}
                    </div>

                    <Modal isOpen={showAddModal} onClose={() => {setShowAddModal(false); setSearchTerm("");}} title="Armar Convocatoria">
                        <div className="space-y-4">
                            <div className="relative">
                                <i className="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-stone-500"></i>
                                <input type="text" placeholder="Buscar..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full bg-stone-900 border border-stone-700 rounded-lg py-2 pl-10 pr-3 text-white outline-none text-sm" />
                            </div>
                            <div className="max-h-64 sm:max-h-72 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                                {filteredNoConvocados.map(p => (
                                    <div key={p.id} className="flex justify-between items-center p-2 hover:bg-stone-700/50 rounded-lg border border-transparent hover:border-stone-600">
                                        <div className="flex items-center gap-2">
                                            <PlayerAvatar player={p} className="w-8 h-8 text-xs" />
                                            <div>
                                                <p className="font-semibold text-stone-200 text-xs sm:text-sm">{formatPlayerName(p, true)}</p>
                                                <p className="text-[10px] sm:text-xs text-stone-500">{p.points || 0} pts en {p.computedMatches || 0} PJ</p>
                                            </div>
                                        </div>
                                        <button onClick={() => handleStatusChange(p.id, 'full')} className="bg-pitch-600/20 text-pitch-400 hover:bg-pitch-600 hover:text-white px-2 py-1 rounded text-xs font-bold transition-colors">
                                            Convocar
                                        </button>
                                    </div>
                                ))}
                            </div>
                            <button onClick={() => setShowAddModal(false)} className="w-full bg-stone-700 hover:bg-stone-600 py-3 rounded-lg text-white font-semibold transition-colors">Listo</button>
                        </div>
                    </Modal>
                </section>
            );
        }

        function MatchHighlightsSection({ currentMatch, updateCurrentMatch, computedPlayers, isAdmin, loggedPlayerId }) {
            if (!currentMatch || currentMatch.status !== 'completed') return null;

            const goalsList = currentMatch.goals || [];
            const scoreA = goalsList.filter(g => g.team === 'A').length;
            const scoreB = goalsList.filter(g => g.team === 'B').length;

            const goalCounts = {};
            goalsList.forEach(g => {
                goalCounts[g.playerId] = (goalCounts[g.playerId] || 0) + 1;
            });

            let scorers = Object.keys(goalCounts).map(pId => {
                const player = computedPlayers.find(p => p.id === pId) || { id: pId, name: 'Desconocido' };
                return { player, count: goalCounts[pId], team: currentMatch.teams?.[pId] };
            });

            // Find the maximum goals scored
            const maxGoals = scorers.length > 0 ? Math.max(...scorers.map(s => s.count)) : 0;
            let candidates = scorers.filter(s => s.count === maxGoals);

            // Tie-Breaker Rule 1: Prioritize the winning team
            let winningTeam = null;
            if (scoreA > scoreB) winningTeam = 'A';
            else if (scoreB > scoreA) winningTeam = 'B';

            if (winningTeam) {
                const winningTeamCandidates = candidates.filter(s => s.team === winningTeam);
                if (winningTeamCandidates.length > 0) candidates = winningTeamCandidates;
            }

            let topScorer = null;
            let isTiedScorer = false;

            // Tie-Breaker Rule 2: Manual Selection if tie persists
            if (candidates.length === 1) {
                topScorer = candidates[0];
            } else if (candidates.length > 1) {
                if (currentMatch.manualTopScorerId) {
                    topScorer = candidates.find(c => c.player.id === currentMatch.manualTopScorerId);
                    if (!topScorer) isTiedScorer = true; // Fallback if ID is wrong
                } else {
                    isTiedScorer = true;
                }
            }

            scorers.sort((a, b) => b.count - a.count);

            const teamAWinner = scoreA > scoreB;
            const teamBWinner = scoreB > scoreA;
            const isDraw = scoreA === scoreB;

            // --- MVP Logic ---
            const isVoting = currentMatch.mvpMode === 'voting';
            const attendees = computedPlayers.filter(p => currentMatch.attendees?.[p.id] && currentMatch.attendees?.[p.id] !== 'none');
            
            let mvpPlayer = null;
            let tiedMvps = [];

            if (isVoting) {
                const votes = currentMatch.mvpVotes || {};
                const voteCounts = {};
                Object.values(votes).forEach(v => voteCounts[v] = (voteCounts[v] || 0) + 1);
                
                const maxVotes = Object.keys(voteCounts).length > 0 ? Math.max(...Object.values(voteCounts)) : 0;
                if (maxVotes > 0) {
                    const leaders = Object.keys(voteCounts).filter(k => voteCounts[k] === maxVotes);
                    if (leaders.length === 1) mvpPlayer = attendees.find(p => p.id === leaders[0]);
                    else tiedMvps = leaders.map(id => attendees.find(p => p.id === id)).filter(Boolean);
                }
            } else {
                if (currentMatch.mvpId) mvpPlayer = attendees.find(p => p.id === currentMatch.mvpId);
            }

            const iAttended = attendees.some(p => p.id === loggedPlayerId);
            const myVote = currentMatch.mvpVotes?.[loggedPlayerId] || '';

            return (
                <section className="bg-gradient-to-br from-stone-800 to-stone-900 rounded-2xl p-3 sm:p-6 shadow-2xl border border-pitch-900/50 mb-6 sm:mb-8 relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-32 h-32 bg-pitch-500/10 blur-3xl rounded-full pointer-events-none"></div>
                    
                    <h2 className="text-lg sm:text-2xl font-black text-white flex items-center justify-center gap-2 mb-4 sm:mb-6 relative z-10 text-center">
                        <i className="ph-fill ph-trophy text-gold text-2xl sm:text-3xl"></i> Resumen del Partido
                    </h2>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-6 relative z-10">
                        {/* Marcador Central */}
                        <div className="bg-stone-900/80 border border-stone-700 p-3 sm:p-6 rounded-2xl flex flex-col items-center justify-center col-span-2 shadow-inner">
                            <p className="text-stone-400 text-[10px] sm:text-sm font-bold uppercase tracking-widest mb-2 sm:mb-4">Marcador Final</p>
                            <div className="flex items-center gap-4 sm:gap-6">
                                <div className="text-center">
                                    <span className={`text-4xl sm:text-6xl font-black ${teamAWinner ? 'text-blue-400' : 'text-stone-500'}`}>{scoreA}</span>
                                    <p className="text-blue-400 text-[10px] sm:text-sm font-bold mt-1 uppercase tracking-wider">Azul</p>
                                </div>
                                <span className="text-2xl sm:text-3xl text-stone-600 font-bold">-</span>
                                <div className="text-center">
                                    <span className={`text-4xl sm:text-6xl font-black ${teamBWinner ? 'text-red-400' : 'text-stone-500'}`}>{scoreB}</span>
                                    <p className="text-red-400 text-[10px] sm:text-sm font-bold mt-1 uppercase tracking-wider">Rojo</p>
                                </div>
                            </div>
                            <div className="mt-3 sm:mt-6 px-3 py-1 sm:py-1.5 rounded-full bg-stone-800 border border-stone-600 text-[10px] sm:text-xs font-bold text-stone-300">
                                {isDraw ? 'Empate' : `Victoria Equipo ${teamAWinner ? 'Azul' : 'Rojo'}`}
                            </div>
                        </div>

                        {/* Top Scorer */}
                        <div className="relative bg-stone-900/80 border border-stone-500 p-3 sm:p-4 flex flex-col items-center justify-start col-span-1 rounded-2xl shadow-inner mt-4 mb-4 sm:mt-6 sm:mb-6 min-h-[220px] sm:min-h-[240px]">
                            <div className="absolute -top-3 sm:-top-4 left-1/2 -translate-x-1/2 bg-stone-400 text-stone-900 text-[9px] sm:text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider shadow-md whitespace-nowrap z-10">
                                MÁX. GOLEADOR
                            </div>

                            {isTiedScorer ? (
                                <>
                                    {isAdmin ? (
                                        <div className="text-center w-full mt-2">
                                            <p className="text-[9px] sm:text-xs font-bold text-stone-300 mb-1 leading-tight">Empate {maxGoals} goles. Elige:</p>
                                            <div className="flex gap-1 flex-wrap justify-center mb-1">
                                                {candidates.map(c => (
                                                    <button key={c.player.id} onClick={() => updateCurrentMatch({...currentMatch, manualTopScorerId: c.player.id})} className="bg-stone-800 hover:bg-stone-700 border border-stone-600 rounded p-1 transition-colors shadow-lg">
                                                        <PlayerAvatar player={c.player} className="w-6 h-6 sm:w-8 sm:h-8" />
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-center text-stone-500 flex flex-col items-center mt-6">
                                            <i className="ph-fill ph-scales text-3xl sm:text-5xl text-stone-600 mb-2"></i>
                                            <p className="text-[10px] sm:text-sm font-bold leading-tight text-stone-400">Empate<br/>en goles</p>
                                        </div>
                                    )}
                                </>
                            ) : topScorer ? (
                                <>
                                    {currentMatch.manualTopScorerId && isAdmin && candidates.length > 1 && (
                                        <button onClick={() => updateCurrentMatch({...currentMatch, manualTopScorerId: null})} className="absolute top-1 right-1 sm:top-2 sm:right-2 text-stone-500 hover:text-red-400"><i className="ph ph-arrow-counter-clockwise"></i></button>
                                    )}
                                    <div className="flex flex-col items-center mt-3 sm:mt-5 w-full flex-1">
                                        <div className="relative">
                                            <PlayerAvatar player={topScorer.player} className="w-16 h-16 sm:w-20 sm:h-20 text-xl sm:text-2xl shadow-xl border-2 border-stone-500" />
                                            <div className="absolute -bottom-1 -right-1 sm:-bottom-2 sm:-right-2 bg-stone-900 rounded-full p-1 border border-stone-600">
                                                <i className="ph-fill ph-soccer-ball text-sm sm:text-xl text-stone-300"></i>
                                            </div>
                                        </div>
                                        <p className="text-white font-bold text-xs sm:text-base mt-3 text-center leading-tight truncate w-full px-1">{formatPlayerName(topScorer.player, true)}</p>
                                        <p className="text-stone-300 font-black text-sm sm:text-lg mt-1 flex items-center gap-1 justify-center"><i className="ph-fill ph-soccer-ball"></i> {topScorer.count} {topScorer.count === 1 ? 'Gol' : 'Goles'}</p>
                                        {topScorer.team && <p className={`text-[10px] sm:text-xs font-bold mt-1 uppercase tracking-wider ${topScorer.team === 'A' ? 'text-blue-400' : 'text-red-400'}`}>Equipo {topScorer.team === 'A' ? 'Azul' : 'Rojo'}</p>}
                                    </div>
                                </>
                            ) : (
                                <div className="text-center text-stone-500 flex flex-col items-center mt-6">
                                    <i className="ph ph-mask-sad text-3xl sm:text-5xl mb-2"></i>
                                    <p className="text-[10px] sm:text-sm font-bold leading-tight">Sin goles</p>
                                </div>
                            )}
                        </div>

                        {/* MVP */}
                        <div className="relative bg-gradient-to-t from-amber-900/20 to-stone-900/80 border border-gold/50 p-3 sm:p-4 flex flex-col items-center justify-start col-span-1 rounded-2xl shadow-[0_0_15px_rgba(251,191,36,0.15)] mt-4 mb-4 sm:mt-6 sm:mb-6 min-h-[220px] sm:min-h-[240px]">
                            <div className="absolute -top-3 sm:-top-4 left-1/2 -translate-x-1/2 bg-gold text-stone-900 text-[9px] sm:text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider shadow-md whitespace-nowrap z-10 flex items-center gap-1">
                                <i className="ph-fill ph-star"></i> MVP OFICIAL
                            </div>

                            {isAdmin && (
                                <div className="absolute top-1 right-1 sm:top-2 sm:right-2 flex overflow-hidden rounded border border-stone-700 text-[7px] sm:text-[9px] font-bold z-20 shadow-md">
                                    <button onClick={() => updateCurrentMatch({ ...currentMatch, mvpMode: 'manual' })} className={`px-1.5 py-0.5 sm:px-2 sm:py-1 transition-colors ${!isVoting ? 'bg-gold text-stone-900' : 'bg-stone-800 text-stone-400 hover:bg-stone-700'}`}>Manual</button>
                                    <button onClick={() => updateCurrentMatch({ ...currentMatch, mvpMode: 'voting' })} className={`px-1.5 py-0.5 sm:px-2 sm:py-1 transition-colors ${isVoting ? 'bg-gold text-stone-900' : 'bg-stone-800 text-stone-400 hover:bg-stone-700'}`}>Votos</button>
                                </div>
                            )}

                            {/* MVP Display */}
                            {mvpPlayer ? (
                                <div className="flex flex-col items-center mt-4 sm:mt-6 w-full flex-1">
                                    <div className="relative">
                                        <PlayerAvatar player={mvpPlayer} className="w-16 h-16 sm:w-20 sm:h-20 text-xl sm:text-2xl shadow-xl border-2 border-gold" />
                                        <div className="absolute -bottom-1 -right-1 sm:-bottom-2 sm:-right-2 bg-stone-900 rounded-full p-1 border border-stone-600">
                                            <i className="ph-fill ph-star text-sm sm:text-xl text-gold"></i>
                                        </div>
                                    </div>
                                    <p className="text-white font-bold text-xs sm:text-base mt-3 text-center leading-tight truncate w-full px-1">{formatPlayerName(mvpPlayer, true)}</p>
                                    <p className="text-gold font-black text-sm sm:text-lg mt-1 flex items-center gap-1 justify-center"><i className="ph-fill ph-medal text-gold"></i> Tier {mvpPlayer.tier || 'C'}</p>
                                    {isVoting ? (
                                        <p className="text-gold text-[10px] sm:text-xs font-bold mt-1 uppercase tracking-wider">{Object.values(currentMatch.mvpVotes || {}).filter(v=>v===mvpPlayer.id).length} {Object.values(currentMatch.mvpVotes || {}).filter(v=>v===mvpPlayer.id).length === 1 ? 'Voto' : 'Votos'}</p>
                                    ) : (
                                        <p className="text-gold text-[10px] sm:text-xs font-bold mt-1 uppercase tracking-wider">Destacado</p>
                                    )}
                                </div>
                            ) : tiedMvps.length > 0 ? (
                                <div className="text-center text-stone-400 flex flex-col items-center mt-6">
                                    <i className="ph-fill ph-users text-3xl sm:text-5xl text-gold mb-2 drop-shadow-md"></i>
                                    <p className="text-[10px] sm:text-xs font-black leading-tight text-gold">Empate de votos</p>
                                </div>
                            ) : (
                                <div className="text-center text-stone-500 flex flex-col items-center mt-6">
                                    <i className="ph ph-user-circle-dashed text-3xl sm:text-5xl mb-2 drop-shadow-sm"></i>

        function LeaderboardSection({ computedPlayers, isAdmin }) {
            const [sortBy, setSortBy] = useState('asistencia');

            const rankedPlayers = computedPlayers.map(p => {
                const percentage = p.attendancePerc || 0;
                let tier = 'C', tierColor = 'text-stone-400', tierBg = 'bg-stone-400/10 border-stone-400/20';
                
                if (percentage >= 75) { tier = 'S'; tierColor = 'text-pitch-400'; tierBg = 'bg-pitch-400/10 border-pitch-400/20'; }
                else if (percentage >= 50) { tier = 'A'; tierColor = 'text-blue-400'; tierBg = 'bg-blue-400/10 border-blue-400/20'; }
                else if (percentage >= 25) { tier = 'B'; tierColor = 'text-gold'; tierBg = 'bg-gold/10 border-gold/20'; }
                else { tier = 'C'; tierColor = 'text-red-400'; tierBg = 'bg-red-400/10 border-red-400/20'; }

                return { ...p, tier, tierColor, tierBg };
            });

            const sortedPlayers = [...rankedPlayers].sort((a, b) => {
                if (sortBy === 'asistencia') return b.attendancePerc - a.attendancePerc;
                if (sortBy === 'victorias') return b.winPerc - a.winPerc;
                if (sortBy === 'goles') return b.totalGoals - a.totalGoals;
                if (sortBy === 'alfabetico') return (a.name || '').localeCompare(b.name || '');
                if (sortBy === 'posicion') return (a.position || '').localeCompare(b.position || '');
                return 0;
            });

            return (
                <section className="bg-stone-800 rounded-2xl p-3 sm:p-6 shadow-xl border border-stone-700/50">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">

                                <option className="bg-stone-900 text-white" value="victorias">Porcentaje de Victorias</option>
                                <option className="bg-stone-900 text-white" value="goles">Cantidad de Goles</option>
                                <option className="bg-stone-900 text-white" value="alfabetico">Orden Alfabético</option>

                        <div className="bg-stone-900 p-1 sm:p-3 rounded-xl border border-stone-700 text-center flex flex-col justify-center"><span className="text-sm sm:text-2xl font-black text-blue-400 block sm:mb-1">Tier A</span><span className="text-[8px] sm:text-xs text-stone-400">74%-50%</span></div>
                        <div className="bg-stone-900 p-1 sm:p-3 rounded-xl border border-stone-700 text-center flex flex-col justify-center"><span className="text-sm sm:text-2xl font-black text-gold block sm:mb-1">Tier B</span><span className="text-[8px] sm:text-xs text-stone-400">49%-25%</span></div>
                        <div className="bg-stone-900 p-1 sm:p-3 rounded-xl border border-stone-700 text-center flex flex-col justify-center"><span className="text-sm sm:text-2xl font-black text-red-400 block sm:mb-1">Tier C</span><span className="text-[8px] sm:text-xs text-stone-400">&lt;25%</span></div>
                    </div>

                    <div className="w-full overflow-x-auto">

                                <tr className="border-b border-stone-700 text-stone-400 text-[8px] sm:text-sm uppercase tracking-wide">
                                    <th className="p-1 sm:p-3 font-semibold w-6 sm:w-12 text-center">#</th>
                                    <th className="p-1 sm:p-3 font-semibold">Chocolatero</th>

        function AdminPanel({ dbState, updateState, computedPlayers, handleExportDB, handleImportDB }) {
            const [filterTag, setFilterTag] = useState('all');
            const [isAddingPlayer, setIsAddingPlayer] = useState(false);
            const [editingPlayerId, setEditingPlayerId] = useState(null);
            const [playerForm, setPlayerForm] = useState({ name: '', lastName: '', alias: '', phone: '', photoUrl: '', username: '', password: '', baseMatches: 0, basePoints: 0, baseGoals: 0, baseWins: 0, position: '' });
            const [playerToDelete, setPlayerToDelete] = useState(null);
            const [formError, setFormError] = useState("");
            const [cropFile, setCropFile] = useState(null);

            const players = dbState?.players || [];
            
            // Computar Etiquetas (Tags) para cada jugador
            const playersWithTags = computedPlayers.map(p => {
                let tags = [];
                if (!p.name) tags.push({id: 'missing_name', label: 'Falta Nombre', color: 'bg-red-900/40 text-red-300 border-red-700/50'});
                if (!p.lastName) tags.push({id: 'missing_lastName', label: 'Falta Apellido', color: 'bg-amber-900/40 text-amber-300 border-amber-700/50'});
                if (!p.phone) tags.push({id: 'missing_phone', label: 'Falta Celular', color: 'bg-orange-900/40 text-orange-300 border-orange-700/50'});
                if (!p.username) tags.push({id: 'missing_user', label: 'Falta Usuario', color: 'bg-yellow-900/40 text-yellow-300 border-yellow-700/50'});
                if (!p.password) tags.push({id: 'missing_pass', label: 'Falta Clave', color: 'bg-yellow-900/40 text-yellow-300 border-yellow-700/50'});
                
                if (tags.length === 0) tags.push({id: 'complete', label: 'Datos Completos', color: 'bg-pitch-900/40 text-pitch-400 border-pitch-700/50'});
                return { ...p, tags };
            });

            // Filtrar Lista según Etiqueta Seleccionada
            const filteredPlayers = filterTag === 'all' 
                ? playersWithTags 
                : playersWithTags.filter(p => p.tags.some(t => t.id === filterTag));

            const handleSavePlayer = () => {
                if (!playerForm.name) {
                    setFormError("⚠️ El Nombre es obligatorio.");
                    return;
                }
                if (playerForm.username) {
                    const isDuplicate = players.some(p => p.username === playerForm.username && p.id !== editingPlayerId);
                    if(isDuplicate) {
                        setFormError("⚠️ Este nombre de usuario ya está en uso.");
                        return;
                    }
                }

                setFormError("");
                const newPlayers = [...players];
                if (editingPlayerId) {
                    const idx = newPlayers.findIndex(p => p.id === editingPlayerId);
                    if (idx !== -1) newPlayers[idx] = { ...newPlayers[idx], ...playerForm };
                } else {
                    newPlayers.push({
                        id: Date.now().toString(),
                        ...playerForm,
                        baseMatches: Number(playerForm.baseMatches) || 0,
                        basePoints: Number(playerForm.basePoints) || 0,
                        baseGoals: Number(playerForm.baseGoals) || 0,
                        baseWins: Number(playerForm.baseWins) || 0
                    });
                }
                updateState({ ...dbState, players: newPlayers });
                setIsAddingPlayer(false);
                setEditingPlayerId(null);
            };

            const confirmDeletePlayer = () => {
                if (!playerToDelete) return;
                updateState({
                    ...dbState,
                    players: players.filter(p => p.id !== playerToDelete),
                });
                setPlayerToDelete(null);
            };

            const editPlayer = (pId) => { 
                const rawP = players.find(x => x.id === pId);
                setPlayerForm({...rawP}); 
                setEditingPlayerId(pId); 
                setIsAddingPlayer(true); 
            };

            return (
                <section className="bg-stone-800 border-2 border-choco-600 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
                    <div className="absolute top-0 right-0 bg-choco-600 text-white text-xs font-bold px-3 py-1 rounded-bl-lg z-10">MODO ADMIN</div>
                    <h2 className="text-2xl font-bold text-white flex items-center gap-2 mb-6 mt-2"><i className="ph-fill ph-database text-choco-400"></i> Base de Datos</h2>

                    <div className="grid md:grid-cols-2 gap-6">
                        <div className="bg-stone-900 rounded-xl p-5 border border-stone-700 flex flex-col justify-between">
                            <div>
                                <h3 className="text-white font-semibold mb-2 flex items-center gap-2"><i className="ph-fill ph-files"></i> Respaldos</h3>

                            <div className="flex gap-2">
                                <button onClick={handleExportDB} className="flex-1 bg-stone-700 hover:bg-stone-600 py-2 rounded-lg text-white font-semibold text-sm transition-colors flex items-center justify-center gap-2"><i className="ph ph-download-simple"></i> Exportar</button>
                                <label className="flex-1 bg-choco-700 hover:bg-choco-600 cursor-pointer py-2 rounded-lg text-white font-semibold text-sm transition-colors flex items-center justify-center gap-2">
                                    <i className="ph ph-upload-simple"></i> Importar <input type="file" accept=".json" className="hidden" onChange={handleImportDB} />
                                </label>

                        </div>

                        <div className="bg-stone-900 rounded-xl p-5 border border-stone-700">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3 border-b border-stone-800 pb-3">
                                <h3 className="text-white font-semibold">Registrados: <span className="text-pitch-400">{filteredPlayers.length}</span></h3>
                                <div className="flex gap-2 w-full sm:w-auto">
                                    <select value={filterTag} onChange={e => setFilterTag(e.target.value)} className="bg-stone-800 border border-stone-600 rounded p-1.5 text-xs text-white outline-none flex-1">
                                        <option value="all">Todas las etiquetas</option>
                                        <option value="complete">✅ Datos Completos</option>
                                        <option value="missing_name">❌ Falta Nombre</option>
                                        <option value="missing_lastName">❌ Falta Apellido</option>
                                        <option value="missing_phone">❌ Falta Celular</option>
                                        <option value="missing_user">❌ Falta Usuario</option>
                                        <option value="missing_pass">❌ Falta Clave</option>
                                    </select>
                                    <button onClick={() => { setPlayerForm({name:'', lastName:'', alias:'', phone:'', photoUrl:'', username:'', password:'', baseMatches:0, basePoints:0, baseGoals:0, baseWins:0, position:''}); setEditingPlayerId(null); setIsAddingPlayer(true); }} className="bg-pitch-600 hover:bg-pitch-500 text-white text-xs px-3 py-1.5 rounded font-bold transition-colors shrink-0">
                                        + Añadir
                                    </button>
                                </div>
                            </div>
                            <div className="max-h-64 overflow-y-auto space-y-2 pr-2 custom-scrollbar">
                                {filteredPlayers.map(p => (
                                    <div key={p.id} className="flex flex-col sm:flex-row justify-between sm:items-center bg-stone-800 p-3 rounded-lg border border-stone-700 gap-2">
                                        <div className="flex items-center gap-3">
                                            <PlayerAvatar player={p} className="w-8 h-8 text-xs shrink-0" />
                                            <div>
                                                <span className="font-medium text-stone-200 block">{formatPlayerName(p, true)}</span>
                                                <div className="flex flex-wrap gap-1 mt-1">
                                                    {p.tags.map(t => <span key={t.id} className={`text-[9px] px-1.5 py-0.5 rounded border ${t.color}`}>{t.label}</span>)}
                                                </div>
