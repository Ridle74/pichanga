<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // --- FORMATTERS ---
        const formatDateShort = (dateStr) => {
            if (!dateStr) return '';
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                const [y, m, d] = dateStr.split('-');
                const date = new Date(y, m - 1, d);
                const options = { weekday: 'long', month: 'long', day: 'numeric' };
                let res = date.toLocaleDateString('es-ES', options).replace(',', '');
                return res.charAt(0).toUpperCase() + res.slice(1);
            }
            return dateStr;
        };

        const formatTimeOnly = (timeStr) => {
            if (!timeStr) return '';
            if (/^\d{2}:\d{2}$/.test(timeStr)) {
                let [h, m] = timeStr.split(':');
                let hour = parseInt(h, 10);
                hour = hour % 12 || 12;
                return `${hour}:${m}`;
            }
            return timeStr;
        };

        const formatDateText = (dateStr) => {
            if (!dateStr) return '';
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                const [y, m, d] = dateStr.split('-');
                const date = new Date(y, m - 1, d);
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                let res = date.toLocaleDateString('es-ES', options);
                return res.charAt(0).toUpperCase() + res.slice(1);
            }
            return dateStr;
        };

        const formatTimeText = (timeStr) => {
            if (!timeStr) return '';
            if (/^\d{2}:\d{2}$/.test(timeStr)) {
                let [h, m] = timeStr.split(':');
                let hour = parseInt(h, 10);
                const ampm = hour >= 12 ? 'p.m.' : 'a.m.';
                hour = hour % 12 || 12;
                return `${hour}:${m} ${ampm}`;
            }
            return timeStr;
        };

        const formatPlayerName = (player, isAdmin) => {
            let name = `${player.name} ${player.lastName ? (isAdmin ? player.lastName : player.lastName.charAt(0) + '.') : ''}`;
            if (player.alias) name += ` "${player.alias}"`;
            return name;
        };

        // --- UTILS ---
        const captureAndDownload = async (elementId, fileName, setDownloading, captureClass = null) => {
            if (!window.html2canvas) return;
            setDownloading(true);
            const element = document.getElementById(elementId);
            if (captureClass) element.classList.add(captureClass);
            await new Promise(r => setTimeout(r, 120));
            try {
                const canvas = await window.html2canvas(element, {
                    scale: 3,
                    useCORS: true,
                    backgroundColor: '#1c1917'
                });
                const link = document.createElement("a");
                link.href = canvas.toDataURL("image/png");
                link.download = `${fileName}_${new Date().getTime()}.png`;
                link.click();
            } catch (err) {
                console.error("Error al exportar la imagen", err);
            }
            if (captureClass) element.classList.remove(captureClass);
            setDownloading(false);
        };

        // --- INITIAL DATA ---
        const initialDB = {
            adminCredentials: { username: "admin", password: "1234" },
            players: [
                { id: "1", name: "Carlos", lastName: "Gomez", alias: "Charly", phone: "987654321", photoUrl: "", username: "carlos", password: "123", baseMatches: 0, basePoints: 0, baseGoals: 0, baseWins: 0, position: "DEL" },
                { id: "2", name: "Luis", lastName: "Perez", alias: "Lucho", phone: "912345678", photoUrl: "", username: "luis", password: "123", baseMatches: 0, basePoints: 0, baseGoals: 0, baseWins: 0, position: "DEF" },
                { id: "3", name: "Jorge", lastName: "", alias: "", phone: "", photoUrl: "", username: "", password: "", baseMatches: 0, basePoints: 0, baseGoals: 0, baseWins: 0, position: "ARQ" }
            ],
            matches: []
        };

        // --- LOCAL STORAGE PERSISTENCE (fallback when no Firebase) ---
        const LS_KEY = 'pichanga_chocolatera_db';
        const loadFromLS = () => {
            try {
                const raw = localStorage.getItem(LS_KEY);
                if (raw) return JSON.parse(raw);
            } catch(e) {}
            return null;
        };
        const saveToLS = (data) => {
            try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch(e) {}
        };

        // --- BASE COMPONENTS ---
        function Modal({ isOpen, onClose, title, children }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                    <div className="bg-stone-800 rounded-2xl w-full max-w-md md:max-w-xl lg:max-w-2xl border border-stone-700 shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="bg-stone-900 border-b border-stone-700 p-4 flex justify-between items-center shrink-0">
                            <h3 className="text-lg font-bold text-pitch-400">{title}</h3>
                            <button onClick={onClose} className="text-stone-400 hover:text-white transition-colors p-1">
                                <i className="ph ph-x text-xl"></i>
                            </button>
                        </div>
                        <div className="p-4 overflow-y-auto custom-scrollbar">
                            {children}
                        </div>
                    </div>
                </div>
            );
        }

        function PlayerAvatar({ player, className = "w-10 h-10 text-sm", style = {} }) {
            const [imgError, setImgError] = useState(false);
            const hasImage = player.photoUrl && !imgError;
            if (hasImage) {
                return <img src={player.photoUrl} alt={player.name} onError={() => setImgError(true)}
                    className={`${className} rounded-full object-cover object-center border border-pitch-500 shadow-inner bg-stone-900 shrink-0`}
                    style={{ flexShrink:0, alignSelf:'center', ...style }} />;
            }
            return (
                <div
                    className={`${className} shrink-0 rounded-full bg-gradient-to-br from-pitch-600 to-pitch-800 border border-pitch-500 shadow-inner`}
                    style={{ display:'flex', alignItems:'center', justifyContent:'center', color:'white', fontWeight:'bold', textTransform:'uppercase', lineHeight:'1', textAlign:'center', flexShrink:0, alignSelf:'center', ...style }}
                >
                    {player.name?.charAt(0)}{player.lastName ? player.lastName.charAt(0) : ''}
                </div>
            );
        }

        function ImageCropperModal({ file, onCropped, onCancel }) {
            const SIZE = 256;
            const [src, setSrc] = useState(null);
            const canvasRef = useRef(null);
            const imgRef = useRef(null);
            const [scale, setScale] = useState(1);
            const [minScale, setMinScale] = useState(0.05);
            const [pos, setPos] = useState({ x: 0, y: 0 });
            const [imgNatural, setImgNatural] = useState({ w: 1, h: 1 });
            const [isDragging, setIsDragging] = useState(false);
            const [startPos, setStartPos] = useState({ x: 0, y: 0 });
            const containerRef = useRef(null);

            // Clamp position: la imagen nunca deja áreas negras dentro del círculo
            const clamp = (x, y, s, nw, nh) => ({
                x: Math.max(SIZE - nw * s, Math.min(0, x)),
                y: Math.max(SIZE - nh * s, Math.min(0, y)),
            });

            const loadFile = (f) => {
                if (!f) return;
                const reader = new FileReader();
                reader.onload = e => setSrc(e.target.result);
                reader.readAsDataURL(f);
            };

            useEffect(() => { loadFile(file); }, [file]);

            // Escuchar pegado de imagen (Ctrl+V) mientras el modal está abierto
            useEffect(() => {
                const handlePaste = (e) => {
                    const items = e.clipboardData?.items;
                    if (!items) return;
                    for (const item of items) {
                        if (item.type.startsWith('image/')) {
                            const f = item.getAsFile();
                            if (f) { loadFile(f); e.preventDefault(); }
                            break;
                        }
                    }
                };
                document.addEventListener('paste', handlePaste);
                return () => document.removeEventListener('paste', handlePaste);
            }, []);

            const onImageLoad = (e) => {
                const { naturalWidth: nw, naturalHeight: nh } = e.target;
                setImgNatural({ w: nw, h: nh });
                const ms = Math.max(SIZE / nw, SIZE / nh);
                setMinScale(ms);
                setScale(ms);
                setPos(clamp((SIZE - nw * ms) / 2, (SIZE - nh * ms) / 2, ms, nw, nh));
            };

            const getRelPos = (clientX, clientY) => {
                const rect = containerRef.current?.getBoundingClientRect() || { left: 0, top: 0 };
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const handleScaleChange = (newScale) => {
                const s = Math.max(minScale, newScale);
                setScale(s);
                setPos(prev => clamp(prev.x, prev.y, s, imgNatural.w, imgNatural.h));
            };

            const handleCrop = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const img = imgRef.current;
                canvas.width = SIZE; canvas.height = SIZE;
                ctx.clearRect(0, 0, SIZE, SIZE);
                ctx.drawImage(img, pos.x, pos.y, img.naturalWidth * scale, img.naturalHeight * scale);
                onCropped(canvas.toDataURL('image/jpeg', 0.9));
            };

            if (!src) return null;

            return (
                <Modal isOpen={true} onClose={onCancel} title="Recortar Imagen">
                    <div className="flex flex-col items-center space-y-4 overflow-hidden">
                        <p className="text-stone-400 text-sm text-center">Arrastra la imagen y ajusta el zoom. El círculo muestra el recorte exacto.</p>

                        <div
                            ref={containerRef}
                            className="relative bg-stone-900 border-2 border-dashed border-stone-500 rounded-full overflow-hidden cursor-move touch-none shadow-inner"
                            style={{ width: `${SIZE}px`, height: `${SIZE}px`, boxSizing: 'content-box', flexShrink: 0 }}
                            onMouseDown={e => { setIsDragging(true); const r = getRelPos(e.clientX, e.clientY); setStartPos({ x: r.x - pos.x, y: r.y - pos.y }); }}
                            onMouseMove={e => { if (!isDragging) return; const r = getRelPos(e.clientX, e.clientY); setPos(clamp(r.x - startPos.x, r.y - startPos.y, scale, imgNatural.w, imgNatural.h)); }}
                            onMouseUp={() => setIsDragging(false)}
                            onMouseLeave={() => setIsDragging(false)}
                            onTouchStart={e => { setIsDragging(true); const r = getRelPos(e.touches[0].clientX, e.touches[0].clientY); setStartPos({ x: r.x - pos.x, y: r.y - pos.y }); }}
                            onTouchMove={e => { if (!isDragging) return; const r = getRelPos(e.touches[0].clientX, e.touches[0].clientY); setPos(clamp(r.x - startPos.x, r.y - startPos.y, scale, imgNatural.w, imgNatural.h)); }}
                            onTouchEnd={() => setIsDragging(false)}
                        >
                            <img ref={imgRef} src={src} onLoad={onImageLoad} alt="Crop preview"
                                style={{ transform: `translate(${pos.x}px, ${pos.y}px) scale(${scale})`, transformOrigin: 'top left', pointerEvents: 'none', maxWidth: 'none' }} />

                            {/* Guías de centrado y borde circular */}
                            <div className="absolute inset-0 pointer-events-none z-10">
                                {/* Línea horizontal */}
                                <div style={{ position:'absolute', width:'100%', height:'1px', background:'rgba(255,255,255,0.45)', top:'50%' }}></div>
                                {/* Línea vertical */}
                                <div style={{ position:'absolute', height:'100%', width:'1px', background:'rgba(255,255,255,0.45)', left:'50%' }}></div>
                                {/* Punto central */}
                                <div style={{ position:'absolute', width:'6px', height:'6px', background:'rgba(255,255,255,0.7)', borderRadius:'50%', top:'calc(50% - 3px)', left:'calc(50% - 3px)' }}></div>
                                {/* Borde circular = límite exacto del recorte */}
                                <div style={{ position:'absolute', inset:0, border:'2px solid rgba(255,255,255,0.55)', borderRadius:'50%' }}></div>
                            </div>
                        </div>

                        <div className="w-full flex items-center gap-3">
                            <i className="ph-fill ph-image text-stone-500 text-xl"></i>
                            <input type="range" min={minScale} max="3" step="0.01" value={scale} onChange={e => handleScaleChange(parseFloat(e.target.value))} className="w-full accent-pitch-500" />
                            <i className="ph-fill ph-magnifying-glass-plus text-stone-500 text-xl"></i>
                        </div>
                        <p className="text-stone-500 text-xs text-center">💡 También puedes pegar una imagen con <kbd className="bg-stone-700 text-stone-300 px-1.5 py-0.5 rounded text-[10px] font-mono">Ctrl+V</kbd></p>
                        <div className="flex gap-2 w-full pt-2 border-t border-stone-700">
                            <button onClick={onCancel} className="flex-1 bg-stone-700 hover:bg-stone-600 py-3 rounded-lg text-white font-semibold transition-colors">Cancelar</button>
                            <button onClick={handleCrop} className="flex-1 bg-pitch-600 hover:bg-pitch-500 py-3 rounded-lg text-white font-bold transition-colors">Aplicar Recorte</button>
                        </div>
                        <canvas ref={canvasRef} className="hidden" />
                    </div>
                </Modal>
            );
        }

        // --- MATCH INFO ---
        function MatchInfoSection({ currentMatch, updateCurrentMatch, deleteMatch, isAdmin }) {
            const [isEditing, setIsEditing] = useState(false);
            const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
            const [formData, setFormData] = useState({});
            const [yapeCopied, setYapeCopied] = useState(false);

            useEffect(() => { if (currentMatch) setFormData({ ...currentMatch }); }, [currentMatch]);

            if (!currentMatch) return null;

            const handleSave = () => { updateCurrentMatch({ ...currentMatch, ...formData }); setIsEditing(false); };

            const handleCopyYape = () => {
                const yapeNumber = "918508591";
                navigator.clipboard.writeText(yapeNumber).then(() => {
                    setYapeCopied(true); setTimeout(() => setYapeCopied(false), 2000);
                }).catch(() => {
                    const t = document.createElement("textarea"); t.value = yapeNumber;
                    document.body.appendChild(t); t.select();
                    try { document.execCommand('copy'); setYapeCopied(true); setTimeout(() => setYapeCopied(false), 2000); } catch(e) {}
                    document.body.removeChild(t);
                });
            };

            return (
                <section className="bg-stone-800 rounded-2xl p-3 sm:p-6 shadow-xl border border-stone-700/50 relative overflow-hidden">
                    <div className="flex justify-between items-start mb-4 sm:mb-6 relative z-10">
                        <h2 className="text-lg sm:text-2xl font-bold text-pitch-400 flex items-center gap-2">
                            <i className="ph-fill ph-calendar-check"></i> {currentMatch.status === 'completed' ? 'Partido Finalizado' : 'Próxima Pichanga'}
                        </h2>
                        {isAdmin && (
                            <div className="flex gap-1.5 sm:gap-2">
                                <button onClick={() => setShowDeleteConfirm(true)} className="text-red-400 hover:text-red-300 bg-red-900/30 p-1.5 sm:p-2 rounded-lg transition-colors border border-red-900/50" title="Eliminar Partido">
                                    <i className="ph ph-trash text-lg sm:text-xl"></i>
                                </button>
                                <button onClick={() => setIsEditing(true)} className="text-pitch-400 hover:text-pitch-300 bg-stone-700/50 p-1.5 sm:p-2 rounded-lg transition-colors border border-stone-600" title="Editar Partido">
                                    <i className="ph ph-pencil-simple text-lg sm:text-xl"></i>
                                </button>
                            </div>
                        )}
                    </div>

                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-2 sm:gap-4 relative z-10">
                        <div className="flex items-start gap-2 bg-stone-900/50 p-2 sm:p-4 rounded-xl border border-stone-700/50">
                            <i className="ph-fill ph-calendar-blank text-lg sm:text-2xl text-choco-400 mt-0.5 sm:mt-1 shrink-0"></i>
                            <div className="min-w-0">
                                <p className="text-[10px] sm:text-sm text-stone-400 font-medium">Fecha y Hora</p>
                                <p className="font-bold text-xs sm:text-base text-white capitalize truncate">{formatDateShort(currentMatch.date)}</p>
                                <p className="text-[10px] sm:text-sm text-stone-300 truncate">{formatTimeOnly(currentMatch.startTime)} - {formatTimeText(currentMatch.endTime)}</p>
                            </div>
                        </div>
                        <div className="flex items-start gap-2 bg-stone-900/50 p-2 sm:p-4 rounded-xl border border-stone-700/50">
                            <i className="ph-fill ph-map-pin text-lg sm:text-2xl text-choco-400 mt-0.5 sm:mt-1 shrink-0"></i>
                            <div className="min-w-0">
                                <p className="text-[10px] sm:text-sm text-stone-400 font-medium">Lugar</p>
                                <p className="font-bold text-xs sm:text-base text-white truncate" title={currentMatch.location}>{currentMatch.location}</p>
                                {currentMatch.mapUrl ? (
                                    <a href={currentMatch.mapUrl} target="_blank" rel="noreferrer" className="text-[10px] sm:text-sm text-blue-400 hover:text-blue-300 hover:underline truncate flex items-center gap-1 transition-colors"><i className="ph-bold ph-map-trifold"></i> Ver mapa</a>
                                ) : (
                                    <p className="text-[10px] sm:text-sm text-stone-500 truncate">Sin ubicación</p>
                                )}
                            </div>
                        </div>
                        <div className="flex items-start gap-2 bg-stone-900/50 p-2 sm:p-4 rounded-xl border border-stone-700/50">
                            <i className="ph-fill ph-coins text-lg sm:text-2xl text-pitch-500 mt-0.5 sm:mt-1 shrink-0"></i>
                            <div className="min-w-0 w-full">
                                <p className="text-[10px] sm:text-sm text-stone-400 font-medium">Cupo</p>
                                <p className="font-bold text-xs sm:text-base text-pitch-400 truncate">S/ {Number(currentMatch.quota).toFixed(2)}</p>
                                <button onClick={handleCopyYape} className="text-[10px] sm:text-sm text-stone-300 hover:text-white truncate flex items-center gap-1 transition-colors w-full text-left" title="Copiar Yape">
                                    {yapeCopied ? <><i className="ph-bold ph-check text-pitch-400"></i><span className="text-pitch-400">¡Copiado!</span></> : <><i className="ph-bold ph-copy"></i> Yape: 918 508 591</>}
                                </button>
                            </div>
                        </div>
                        <div className="flex items-start gap-2 bg-stone-900/50 p-2 sm:p-4 rounded-xl border border-stone-700/50">
                            <i className="ph-fill ph-clock-countdown text-lg sm:text-2xl text-red-400 mt-0.5 sm:mt-1 shrink-0"></i>
                            <div className="min-w-0">
                                <p className="text-[10px] sm:text-sm text-stone-400 font-medium truncate">Plazo Yapeo</p>
                                <p className="font-bold text-xs sm:text-base text-red-300 capitalize truncate">{formatDateShort(currentMatch.deadlineDate)}</p>
                                <p className="text-[10px] sm:text-sm text-red-400 truncate">{formatTimeText(currentMatch.deadlineTime)}</p>
                            </div>
                        </div>
                    </div>

                    <Modal isOpen={isEditing} onClose={() => setIsEditing(false)} title="Editar Información del Partido">
                        <div className="space-y-4 max-h-[70vh] overflow-y-auto custom-scrollbar pr-2">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div><label className="block text-sm text-stone-400 mb-1">Fecha</label><input type="date" value={formData.date||''} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white outline-none" /></div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div><label className="block text-sm text-stone-400 mb-1">Inicio</label><input type="time" value={formData.startTime||''} onChange={e => setFormData({...formData, startTime: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white outline-none" /></div>
                                    <div><label className="block text-sm text-stone-400 mb-1">Fin</label><input type="time" value={formData.endTime||''} onChange={e => setFormData({...formData, endTime: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white outline-none" /></div>
                                </div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div><label className="block text-sm text-stone-400 mb-1">Lugar</label><input type="text" value={formData.location||''} onChange={e => setFormData({...formData, location: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white outline-none" /></div>
                                <div><label className="block text-sm text-stone-400 mb-1">Link Google Maps (Opcional)</label><input type="text" value={formData.mapUrl||''} onChange={e => setFormData({...formData, mapUrl: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white outline-none" /></div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div><label className="block text-sm text-stone-400 mb-1">Cuota (S/)</label><input type="number" step="0.10" value={formData.quota||''} onChange={e => setFormData({...formData, quota: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white outline-none" /></div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div><label className="block text-sm text-stone-400 mb-1">Día Límite</label><input type="date" value={formData.deadlineDate||''} onChange={e => setFormData({...formData, deadlineDate: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white outline-none" /></div>
                                    <div><label className="block text-sm text-stone-400 mb-1">Hora Límite</label><input type="time" value={formData.deadlineTime||''} onChange={e => setFormData({...formData, deadlineTime: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white outline-none" /></div>
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm text-stone-400 mb-1">Estado del Partido</label>
                                <select value={formData.status||'upcoming'} onChange={e => setFormData({...formData, status: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white outline-none">
                                    <option className="bg-stone-900 text-white" value="upcoming">Próxima / En Curso</option>
                                    <option className="bg-stone-900 text-white" value="completed">Finalizada (Suma a estadísticas)</option>
                                </select>
                            </div>
                            <button onClick={handleSave} className="w-full bg-pitch-600 hover:bg-pitch-500 py-3 rounded-lg text-white font-bold transition-colors">Guardar Cambios</button>
                        </div>
                    </Modal>

                    <Modal isOpen={showDeleteConfirm} onClose={() => setShowDeleteConfirm(false)} title="Eliminar Partido">
                        <div className="space-y-4">
                            <div className="bg-red-900/20 p-4 rounded-lg border border-red-700/50">
                                <p className="text-stone-300 text-sm leading-relaxed">¿Seguro que deseas eliminar este partido?</p>
                                <p className="text-red-400 text-sm font-semibold mt-2">Esta acción no se puede deshacer y se borrarán todos los datos (asistencias, goles, equipos) asociados a esta fecha.</p>
                            </div>
                            <div className="flex gap-3 mt-4">
                                <button onClick={() => setShowDeleteConfirm(false)} className="flex-1 bg-stone-700 hover:bg-stone-600 py-3 rounded-lg text-white font-semibold transition-colors">Cancelar</button>
                                <button onClick={() => { if(deleteMatch) deleteMatch(currentMatch.id); setShowDeleteConfirm(false); }} className="flex-1 bg-red-600 hover:bg-red-500 py-3 rounded-lg text-white font-semibold shadow-lg shadow-red-900/50 transition-colors">Sí, Eliminar</button>
                            </div>
                        </div>
                    </Modal>
                </section>
            );
        }

        // --- ROSTER SECTION ---
        function CurrentRosterSection({ currentMatch, updateCurrentMatch, computedPlayers, isAdmin }) {
            const [showAddModal, setShowAddModal] = useState(false);
            const [searchTerm, setSearchTerm] = useState("");
            const [copyFeedback, setCopyFeedback] = useState(false);
            const [copyMsgFeedback, setCopyMsgFeedback] = useState(false);
            const [isDownloading, setIsDownloading] = useState(false);

            if (!currentMatch) return null;

            const attendeesMap = currentMatch.attendees || {};
            const isCompleted = currentMatch.status === 'completed';

            const convocadosList = computedPlayers.filter(p => attendeesMap[p.id] && attendeesMap[p.id] !== 'none');
            const noConvocadosList = computedPlayers.filter(p => !attendeesMap[p.id] || attendeesMap[p.id] === 'none');

            const filteredNoConvocados = noConvocadosList.filter(p =>
                p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                (p.lastName && p.lastName.toLowerCase().includes(searchTerm.toLowerCase())) ||
                (p.alias && p.alias.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            const totalCollected = convocadosList.reduce((sum, p) => {
                if (attendeesMap[p.id] === 'full') return sum + Number(currentMatch.quota);
                if (attendeesMap[p.id] === 'half') return sum + (Number(currentMatch.quota) / 2);
                return sum;
            }, 0);

            const handleStatusChange = (playerId, newStatus) => {
                const newAttendees = { ...attendeesMap };
                if (newStatus === 'none') delete newAttendees[playerId];
                else newAttendees[playerId] = newStatus;
                updateCurrentMatch({ ...currentMatch, attendees: newAttendees });
            };

            const handleCopyNumbers = () => {
                const textToCopy = convocadosList.filter(p => p.phone).map(p => `${p.name} ${p.lastName || ''} - ${p.phone}`).join('\n');
                if (textToCopy) {
                    navigator.clipboard.writeText(textToCopy).then(() => { setCopyFeedback(true); setTimeout(() => setCopyFeedback(false), 2000); }).catch(() => {
                        const t = document.createElement("textarea"); t.value = textToCopy;
                        document.body.appendChild(t); t.select();
                        try { document.execCommand('copy'); setCopyFeedback(true); setTimeout(() => setCopyFeedback(false), 2000); } catch(e) {}
                        document.body.removeChild(t);
                    });
                }
            };

            const handleCopyMessage = () => {
                const SITE_URL = 'https://pchocolatera.com';
                const WD_SHORT = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
                const MO_SHORT = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
                const WD_LONG  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

                const parseDateLocal = (ds) => { if(!ds) return null; const [y,m,d]=ds.split('-'); return new Date(+y,+m-1,+d); };

                const d = parseDateLocal(currentMatch.date);
                const dateHeader = d ? `${WD_SHORT[d.getDay()]} ${d.getDate()} ${MO_SHORT[d.getMonth()]}` : '';

                const fmtTime = (ts) => {
                    if(!ts||!/^\d{2}:\d{2}$/.test(ts)) return ts||'';
                    const [h,m]=ts.split(':'); let hr=+h; const ap=hr>=12?'p.m.':'a.m.'; hr=hr%12||12;
                    return `${hr}:${m} ${ap}`;
                };
                const horario = `${fmtTime(currentMatch.startTime)} - ${fmtTime(currentMatch.endTime)}`;

                const dd = parseDateLocal(currentMatch.deadlineDate);
                let deadline = '';
                if (dd) {
                    const ts = currentMatch.deadlineTime;
                    let timeStr = '';
                    if (ts && /^\d{2}:\d{2}$/.test(ts)) {
                        const [h,m]=ts.split(':'); let hr=+h; const ap=hr>=12?'pm':'am'; hr=hr%12||12;
                        timeStr = ` ${hr}${m!=='00'?':'+m:''} ${ap}`;
                    }
                    deadline = `${WD_LONG[dd.getDay()]}${timeStr}`;
                }

                const STATUS_ICON = {
                    full:            '💯',
                    half:            '🌗',
                    free:            '🎁',
                    pending_payment: '🔴',
                    absent:          '❌',
                    excused:         '🏥',
                };

                const playerLines = convocadosList.map((p, i) => {
                    const name = p.name + (p.lastName ? ` ${p.lastName.charAt(0)}.` : '');
                    const icon = STATUS_ICON[attendeesMap[p.id]] || '📋';
                    return `${String(i+1).padStart(2,'0')}. ${name} ${icon}`;
                }).join('\n');

                const msg = `*🔥 CONVOCADOS ${dateHeader} 🔥*\n\n*Lugar:* ${currentMatch.location || '-'}\n*Horario:* ${horario}\n*Fecha de Adelanto:* ${deadline}\n\nPágina: ${SITE_URL}\n\n${playerLines}\n\n*Más Información en la página*`;

                navigator.clipboard.writeText(msg).then(() => { setCopyMsgFeedback(true); setTimeout(() => setCopyMsgFeedback(false), 2500); }).catch(() => {
                    const t = document.createElement('textarea'); t.value = msg;
                    document.body.appendChild(t); t.select();
                    try { document.execCommand('copy'); setCopyMsgFeedback(true); setTimeout(() => setCopyMsgFeedback(false), 2500); } catch(e) {}
                    document.body.removeChild(t);
                });
            };

            return (
                <section id="roster-capture-area" className="bg-stone-800 rounded-2xl p-3 sm:p-6 shadow-xl border border-stone-700/50 relative">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 sm:mb-6 gap-3 sm:gap-4">
                        <div>
                            <h2 className="text-lg sm:text-2xl font-bold text-white flex items-center gap-2">
                                <i className="ph-fill ph-users-three text-pitch-400"></i> Convocados
                            </h2>
                            <p className="text-stone-400 text-[10px] sm:text-sm mt-0.5">
                            {convocadosList.length} Chocolateros {isAdmin && <span data-html2canvas-ignore="true">• Recaudado: <span className="text-pitch-400 font-bold">S/ {totalCollected.toFixed(2)}</span></span>}
                        </p>
                        </div>
                        <div className="flex flex-wrap gap-1.5 sm:gap-2 w-full sm:w-auto" data-html2canvas-ignore="true">
                            {isAdmin && (
                                <button onClick={handleCopyNumbers} className="flex-1 sm:flex-none bg-blue-900/50 hover:bg-blue-800/80 text-blue-300 px-2 sm:px-4 py-1.5 sm:py-2 rounded-lg font-semibold flex items-center justify-center gap-1.5 transition-colors border border-blue-900 text-[10px] sm:text-sm">
                                    {copyFeedback ? <><i className="ph-fill ph-check"></i> Copiados</> : <><i className="ph ph-copy"></i> N°s</>}
                                </button>
                            )}
                            {isAdmin && (
                                <button onClick={handleCopyMessage} className="flex-1 sm:flex-none bg-green-900/50 hover:bg-green-800/80 text-green-300 px-2 sm:px-4 py-1.5 sm:py-2 rounded-lg font-semibold flex items-center justify-center gap-1.5 transition-colors border border-green-900 text-[10px] sm:text-sm" title="Copiar mensaje de convocatoria para WhatsApp">
                                    {copyMsgFeedback ? <><i className="ph-fill ph-check"></i> ¡Listo!</> : <><i className="ph ph-whatsapp-logo"></i> WA</>}
                                </button>
                            )}
                            {isAdmin && !isCompleted && (
                                <button onClick={() => setShowAddModal(true)} className="flex-[2] sm:flex-none bg-stone-700 hover:bg-stone-600 text-white px-2 sm:px-4 py-1.5 sm:py-2 rounded-lg font-semibold flex items-center justify-center gap-1.5 transition-colors border border-stone-600 text-[10px] sm:text-sm">
                                    <i className="ph ph-user-plus"></i> Armar Lista
                                </button>
                            )}
                            {isAdmin && isCompleted && (
                                <div className="flex-[2] sm:flex-none bg-pitch-900/50 text-pitch-400 px-2 sm:px-4 py-1.5 sm:py-2 rounded-lg font-semibold flex items-center justify-center gap-1.5 border border-pitch-900 text-[10px] sm:text-sm text-center leading-tight">
                                    <i className="ph-fill ph-check-circle"></i> Partido Finalizado
                                </div>
                            )}
                            {isAdmin && (
                                <button onClick={() => captureAndDownload('roster-capture-area', `Convocados_${currentMatch.date}`, setIsDownloading, 'jpg-capturing')} className="flex-1 sm:flex-none bg-pitch-600 hover:bg-pitch-500 text-white px-2 sm:px-4 py-1.5 sm:py-2 rounded-lg font-semibold flex items-center justify-center gap-1.5 transition-colors shadow-md text-[10px] sm:text-sm">
                                    {isDownloading ? <i className="ph ph-spinner animate-spin"></i> : <i className="ph ph-download-simple"></i>} JPG
                                </button>
                            )}
                        </div>
                    </div>

                    {(() => {
                        const BADGE = {
                            full:            { c:'text-pitch-400', bg:'bg-pitch-400/10', b:'border-pitch-400/20', i:'ph-fill ph-check-circle',   label:'Adelanto Confirmado' },
                            half:            { c:'text-gold',      bg:'bg-gold/10',      b:'border-gold/20',      i:'ph-fill ph-star-half',        label:'Medio Cupo' },
                            free:            { c:'text-blue-400',  bg:'bg-blue-400/10',  b:'border-blue-400/20',  i:'ph-fill ph-gift',             label:'Invitado' },
                            pending_payment: { c:'text-red-400',   bg:'bg-red-400/10',   b:'border-red-400/20',   i:'ph-fill ph-warning-circle',   label:'Falta Adelanto' },
                            absent:          { c:'text-red-400',   bg:'bg-red-400/10',   b:'border-red-400/20',   i:'ph-fill ph-x-circle',         label:'Faltó' },
                            excused:         { c:'text-stone-400', bg:'bg-stone-400/10', b:'border-stone-400/20', i:'ph-fill ph-first-aid',        label:'Justificado' },
                        };
                        const canEdit = isAdmin && !isCompleted;
                        return (
                    <div className={`grid gap-2 sm:gap-3 ${canEdit ? 'grid-cols-1 sm:grid-cols-2' : 'grid-cols-2'}`}>
                        {convocadosList.map(player => {
                            const status = attendeesMap[player.id];
                            const bd = BADGE[status];
                            return (
                                <div key={player.id}
                                    className="player-card flex items-center gap-2 sm:gap-3 bg-stone-900 px-2 sm:px-3 py-2 sm:py-2.5 rounded-xl border border-stone-700 min-w-0"
                                    style={{ display:'flex', alignItems:'center', flexDirection:'row' }}>
                                    {/* 1. Avatar */}
                                    <PlayerAvatar player={player} className="w-8 h-8 sm:w-9 sm:h-9 text-xs shrink-0"
                                        style={{ flexShrink:0, alignSelf:'center' }} />

                                    {/* 2. Nombre */}
                                    <p className="player-name font-semibold text-stone-100 text-[10px] sm:text-sm leading-tight truncate"
                                        style={{ flex:'1 1 0', minWidth:0, alignSelf:'center', lineHeight:'1.4', overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis' }}>
                                        {player.name}{player.lastName ? ` ${player.lastName}` : ''}
                                    </p>

                                    {/* 3+4. Badge de estado + posición (visibles en JPG) */}
                                    <div className="badge-wrap flex items-center gap-1 shrink-0"
                                        style={{ display:'flex', alignItems:'center', alignSelf:'center', flexShrink:0, gap:'4px' }}>
                                        {bd && (
                                            <div className={`badge-status inline-flex items-center gap-0.5 ${bd.c} ${bd.bg} border ${bd.b} px-1 py-0.5 rounded text-[8px] sm:text-[10px] font-semibold whitespace-nowrap`}
                                                style={{ display:'inline-flex', alignItems:'center', justifyContent:'center', lineHeight:'1.2', whiteSpace:'nowrap' }}>
                                                <i className={bd.i}></i>
                                                <span className="hidden sm:inline">{bd.label}</span>
                                                <span className="sm:hidden">{bd.label.replace('Adelanto ','').replace(' Adelanto','')}</span>
                                            </div>
                                        )}
                                        {player.position && (
                                            <span className="badge-pos inline-flex items-center justify-center text-[8px] sm:text-[9px] font-bold text-stone-300 bg-stone-700 border border-stone-600 px-1 py-0.5 rounded whitespace-nowrap"
                                                style={{ display:'inline-flex', alignItems:'center', justifyContent:'center', lineHeight:'1.2', whiteSpace:'nowrap' }}>
                                                {player.position}
                                            </span>
                                        )}
                                    </div>

                                    {/* 5. Select de edición (oculto en JPG) */}
                                    {canEdit && (
                                        <select data-html2canvas-ignore="true" value={status}
                                            onChange={(e) => handleStatusChange(player.id, e.target.value)}
                                            className="shrink-0 bg-stone-800 text-[8px] sm:text-xs border border-stone-600 rounded-md px-1 py-0.5 focus:border-pitch-500 outline-none text-stone-200 font-semibold max-w-[90px] sm:max-w-[145px]">
                                            <option className="bg-stone-900 text-white" value="full">✔️ Confirmado</option>
                                            <option className="bg-stone-900 text-white" value="half">🌗 Medio Cupo</option>
                                            <option className="bg-stone-900 text-white" value="free">🎁 Invitado</option>
                                            <option className="bg-stone-900 text-white" value="pending_payment">🔴 Falta Adelanto</option>
                                            <option className="bg-stone-900 text-white" value="absent">❌ Faltó</option>
                                            <option className="bg-stone-900 text-white" value="excused">🏥 Justificado</option>
                                            <option className="bg-stone-900 text-red-400" value="none">🗑️ Quitar</option>
                                        </select>
                                    )}
                                </div>
                            );
                        })}
                        {convocadosList.length === 0 && (
                            <div className="col-span-2 text-center py-10 border-2 border-dashed border-stone-700 rounded-xl bg-stone-900/50">
                                <i className="ph ph-users-three text-4xl sm:text-5xl text-stone-600 mb-3 block"></i>
                                <p className="text-stone-400 font-medium text-sm sm:text-lg">Aún no hay convocados en la lista oficial.</p>
                            </div>
                        )}
                    </div>
                        );
                    })()}

                    <Modal isOpen={showAddModal} onClose={() => {setShowAddModal(false); setSearchTerm("");}} title="Armar Convocatoria">
                        <div className="space-y-4">
                            <div className="relative">
                                <i className="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-stone-500"></i>
                                <input type="text" placeholder="Buscar..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full bg-stone-900 border border-stone-700 rounded-lg py-2 pl-10 pr-3 text-white outline-none text-sm" />
                            </div>
                            <div className="max-h-64 sm:max-h-72 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                                {filteredNoConvocados.map(p => (
                                    <div key={p.id} className="flex justify-between items-center p-2 hover:bg-stone-700/50 rounded-lg border border-transparent hover:border-stone-600">
                                        <div className="flex items-center gap-2">
                                            <PlayerAvatar player={p} className="w-8 h-8 text-xs" />
                                            <div>
                                                <p className="font-semibold text-stone-200 text-xs sm:text-sm">{formatPlayerName(p, true)}</p>
                                                <p className="text-[10px] sm:text-xs text-stone-500">{p.points || 0} pts en {p.computedMatches || 0} PJ</p>
                                            </div>
                                        </div>
                                        <button onClick={() => handleStatusChange(p.id, 'full')} className="bg-pitch-600/20 text-pitch-400 hover:bg-pitch-600 hover:text-white px-2 py-1 rounded text-xs font-bold transition-colors">
                                            Convocar
                                        </button>
                                    </div>
                                ))}
                            </div>
                            <button onClick={() => setShowAddModal(false)} className="w-full bg-stone-700 hover:bg-stone-600 py-3 rounded-lg text-white font-semibold transition-colors">Listo</button>
                        </div>
                    </Modal>
                </section>
            );
        }

        // --- MATCH HIGHLIGHTS ---
        function MatchHighlightsSection({ currentMatch, updateCurrentMatch, computedPlayers, isAdmin, loggedPlayerId }) {
            if (!currentMatch || currentMatch.status !== 'completed') return null;

            const goalsList = currentMatch.goals || [];
            const scoreA = goalsList.filter(g => g.team === 'A').length;
            const scoreB = goalsList.filter(g => g.team === 'B').length;

            const goalCounts = {};
            goalsList.forEach(g => { goalCounts[g.playerId] = (goalCounts[g.playerId] || 0) + 1; });

            let scorers = Object.keys(goalCounts).map(pId => {
                const player = computedPlayers.find(p => p.id === pId) || { id: pId, name: 'Desconocido' };
                return { player, count: goalCounts[pId], team: currentMatch.teams?.[pId] };
            });

            const maxGoals = scorers.length > 0 ? Math.max(...scorers.map(s => s.count)) : 0;
            let candidates = scorers.filter(s => s.count === maxGoals);

            let winningTeam = null;
            if (scoreA > scoreB) winningTeam = 'A';
            else if (scoreB > scoreA) winningTeam = 'B';

            if (winningTeam) {
                const wc = candidates.filter(s => s.team === winningTeam);
                if (wc.length > 0) candidates = wc;
            }

            let topScorer = null, isTiedScorer = false;
            if (candidates.length === 1) {
                topScorer = candidates[0];
            } else if (candidates.length > 1) {
                if (currentMatch.manualTopScorerId) {
                    topScorer = candidates.find(c => c.player.id === currentMatch.manualTopScorerId);
                    if (!topScorer) isTiedScorer = true;
                } else {
                    isTiedScorer = true;
                }
            }

            scorers.sort((a, b) => b.count - a.count);

            const teamAWinner = scoreA > scoreB, teamBWinner = scoreB > scoreA, isDraw = scoreA === scoreB;
            const isVoting = currentMatch.mvpMode === 'voting';
            const attendees = computedPlayers.filter(p => currentMatch.attendees?.[p.id] && currentMatch.attendees?.[p.id] !== 'none');

            let mvpPlayer = null, tiedMvps = [];
            if (isVoting) {
                const votes = currentMatch.mvpVotes || {};
                const voteCounts = {};
                Object.values(votes).forEach(v => voteCounts[v] = (voteCounts[v] || 0) + 1);
                const maxVotes = Object.keys(voteCounts).length > 0 ? Math.max(...Object.values(voteCounts)) : 0;
                if (maxVotes > 0) {
                    const leaders = Object.keys(voteCounts).filter(k => voteCounts[k] === maxVotes);
                    if (leaders.length === 1) mvpPlayer = attendees.find(p => p.id === leaders[0]);
                    else tiedMvps = leaders.map(id => attendees.find(p => p.id === id)).filter(Boolean);
                }
            } else {
                if (currentMatch.mvpId) mvpPlayer = attendees.find(p => p.id === currentMatch.mvpId);
            }

            const iAttended = attendees.some(p => p.id === loggedPlayerId);
            const myVote = currentMatch.mvpVotes?.[loggedPlayerId] || '';

            return (
                <section className="bg-gradient-to-br from-stone-800 to-stone-900 rounded-2xl p-3 sm:p-6 shadow-2xl border border-pitch-900/50 mb-6 sm:mb-8 relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-32 h-32 bg-pitch-500/10 blur-3xl rounded-full pointer-events-none"></div>
                    <h2 className="text-lg sm:text-2xl font-black text-white flex items-center justify-center gap-2 mb-4 sm:mb-6 relative z-10 text-center">
                        <i className="ph-fill ph-trophy text-gold text-2xl sm:text-3xl"></i> Resumen del Partido
                    </h2>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-6 relative z-10">
                        {/* Marcador */}
                        <div className="bg-stone-900/80 border border-stone-700 p-3 sm:p-6 rounded-2xl flex flex-col items-center justify-center col-span-2 shadow-inner">
                            <p className="text-stone-400 text-[10px] sm:text-sm font-bold uppercase tracking-widest mb-2 sm:mb-4">Marcador Final</p>
                            <div className="flex items-center gap-4 sm:gap-6">
                                <div className="text-center">
                                    <span className={`text-4xl sm:text-6xl font-black ${teamAWinner ? 'text-blue-400' : 'text-stone-500'}`}>{scoreA}</span>
                                    <p className="text-blue-400 text-[10px] sm:text-sm font-bold mt-1 uppercase tracking-wider">Azul</p>
                                </div>
                                <span className="text-2xl sm:text-3xl text-stone-600 font-bold">-</span>
                                <div className="text-center">
                                    <span className={`text-4xl sm:text-6xl font-black ${teamBWinner ? 'text-red-400' : 'text-stone-500'}`}>{scoreB}</span>
                                    <p className="text-red-400 text-[10px] sm:text-sm font-bold mt-1 uppercase tracking-wider">Rojo</p>
                                </div>
                            </div>
                            <div className="mt-3 sm:mt-6 px-3 py-1 sm:py-1.5 rounded-full bg-stone-800 border border-stone-600 text-[10px] sm:text-xs font-bold text-stone-300">
                                {isDraw ? 'Empate' : `Victoria Equipo ${teamAWinner ? 'Azul' : 'Rojo'}`}

                        {/* Top Scorer */}
                        <div className="relative bg-stone-900/80 border border-stone-500 p-3 sm:p-4 flex flex-col items-center justify-start col-span-1 rounded-2xl shadow-inner mt-4 mb-4 sm:mt-6 sm:mb-6 min-h-[220px] sm:min-h-[240px]">
                            <div className="absolute -top-3 sm:-top-4 left-1/2 -translate-x-1/2 bg-stone-400 text-stone-900 text-[9px] sm:text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider shadow-md whitespace-nowrap z-10">MÁX. GOLEADOR</div>
                            {isTiedScorer ? (
                                <>
                                    {isAdmin ? (
                                        <div className="text-center w-full mt-2">
                                            <p className="text-[9px] sm:text-xs font-bold text-stone-300 mb-1 leading-tight">Empate {maxGoals} goles. Elige:</p>
                                            <div className="flex gap-1 flex-wrap justify-center mb-1">
                                                {candidates.map(c => (
                                                    <button key={c.player.id} onClick={() => updateCurrentMatch({...currentMatch, manualTopScorerId: c.player.id})} className="bg-stone-800 hover:bg-stone-700 border border-stone-600 rounded p-1 transition-colors shadow-lg">
                                                        <PlayerAvatar player={c.player} className="w-6 h-6 sm:w-8 sm:h-8" />

                                            </div>
