                                    <div><label className="block text-[10px] text-stone-400 mb-1">Ptos Asist.</label><input type="number" step="0.5" value={playerForm.basePoints} onChange={e => setPlayerForm({...playerForm, basePoints: Number(e.target.value)})} className="w-full bg-stone-900 border border-stone-700 rounded p-1 text-white text-xs text-center outline-none" /></div>
                                    <div><label className="block text-[10px] text-stone-400 mb-1">Goles</label><input type="number" value={playerForm.baseGoals} onChange={e => setPlayerForm({...playerForm, baseGoals: Number(e.target.value)})} className="w-full bg-stone-900 border border-stone-700 rounded p-1 text-white text-xs text-center outline-none" /></div>
                                    <div><label className="block text-[10px] text-stone-400 mb-1">P. Ganados</label><input type="number" value={playerForm.baseWins} onChange={e => setPlayerForm({...playerForm, baseWins: Number(e.target.value)})} className="w-full bg-stone-900 border border-stone-700 rounded p-1 text-white text-xs text-center outline-none" /></div>
                                </div>
                            </div>
                            <button onClick={handleSavePlayer} className="w-full bg-pitch-600 hover:bg-pitch-500 py-3 rounded-lg text-white font-bold mt-4 transition-colors sticky bottom-0">Guardar Chocolatero</button>
                        </div>
                    </Modal>

                    <Modal isOpen={!!playerToDelete} onClose={() => setPlayerToDelete(null)} title="Eliminar Chocolatero">
                        <div className="space-y-4">
                            <div className="bg-red-900/20 p-4 rounded-lg border border-red-700/50">
                                <p className="text-stone-300 text-sm leading-relaxed">¿Seguro que deseas eliminar a este chocolatero de la base de datos?</p>
                                <p className="text-red-400 text-sm font-semibold mt-2">¡Se perderá todo su historial de partidos y asistencias!</p>
                            </div>
                            <div className="flex gap-3 mt-4">
                                <button onClick={() => setPlayerToDelete(null)} className="flex-1 bg-stone-700 hover:bg-stone-600 py-3 rounded-lg text-white font-semibold transition-colors">Cancelar</button>
                                <button onClick={confirmDeletePlayer} className="flex-1 bg-red-600 hover:bg-red-500 py-3 rounded-lg text-white font-semibold shadow-lg shadow-red-900/50 transition-colors">Sí, Eliminar</button>
                            </div>
                        </div>
                    </Modal>

                    {cropFile && <ImageCropperModal file={cropFile} onCropped={(dataUrl) => { setPlayerForm({...playerForm, photoUrl: dataUrl}); setCropFile(null); }} onCancel={() => setCropFile(null)} />}
                </section>
            );
        }

        // --- MAIN APP ---
        function App() {
            const [dbState, setDbState] = useState(() => loadFromLS() || initialDB);
            const [user, setUser] = useState(null);
            const [isSyncing, setIsSyncing] = useState(true);
            const [selectedMatchId, setSelectedMatchId] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [loggedPlayerId, setLoggedPlayerId] = useState(null);
            const [showLogin, setShowLogin] = useState(false);
            const [loginUser, setLoginUser] = useState('');
            const [loginPass, setLoginPass] = useState('');
            const [loginError, setLoginError] = useState('');
            const [showAdminConfig, setShowAdminConfig] = useState(false);
            const [adminConfigForm, setAdminConfigForm] = useState({ username: '', password: '' });
            const [showProfileConfig, setShowProfileConfig] = useState(false);
            const [playerConfigForm, setPlayerConfigForm] = useState({});
            const [profileCropFile, setProfileCropFile] = useState(null);

            // Escuchar Ctrl+V para pegar imagen en el modal de perfil
            useEffect(() => {
                if (!showProfileConfig) return;
                const handler = (e) => {
                    const items = e.clipboardData?.items;
                    if (!items) return;
                    for (const item of items) {
                        if (item.type.startsWith('image/')) {
                            setProfileCropFile(item.getAsFile());
                            e.preventDefault();
                            break;
                        }
                    }
                };
                document.addEventListener('paste', handler);
                return () => document.removeEventListener('paste', handler);
            }, [showProfileConfig]);
            const [useFirebase, setUseFirebase] = useState(false);
            const unsubscribeRef = useRef(null);
            const firebaseRef = useRef(null); // { docRef } tras init

            // ── Firebase: init + auth + subscribe ──
            useEffect(() => {
                const FB_CONFIG = {
                    apiKey: "AIzaSyBinanH1KCpAYL58VQBT2KKCOnzUFMhof8",
                    authDomain: "pichanga-chocolatera.firebaseapp.com",
                    projectId: "pichanga-chocolatera",
                    storageBucket: "pichanga-chocolatera.firebasestorage.app",
                    messagingSenderId: "27861650922",
                    appId: "1:27861650922:web:bf670c886d54f358c57693"
                };
                const APP_ID = "1:27861650922:web:bf670c886d54f358c57693";

                if (typeof firebase === 'undefined') {
                    console.warn('[Firebase] SDK no cargó. Usando localStorage.');
                    setIsSyncing(false);
                    return;
                }

                let fbApp;
                try { fbApp = firebase.app(); }
                catch { fbApp = firebase.initializeApp(FB_CONFIG); }

                const auth   = firebase.auth(fbApp);
                const db     = firebase.firestore(fbApp);
                const docRef = db.collection('artifacts').doc(APP_ID)
                                 .collection('public').doc('data')
                                 .collection('app_state').doc('current');

                firebaseRef.current = { docRef };

                // Arranca el listener de Firestore independientemente de si auth tuvo éxito
                const startListening = () => {
                    const unsub = docRef.onSnapshot(
                        (snap) => {
                            if (snap.exists) {
                                let data = snap.data();
                                // migración legacy
                                if (data.match && !data.matches) {
                                    data.matches = [{ id: Date.now().toString(), ...data.match, status: 'upcoming' }];
                                    delete data.match;
                                    docRef.set(data);
                                }
                                setDbState(data);
                                saveToLS(data);
                            } else {
                                // Documento vacío → escribir datos iniciales
                                const initial = loadFromLS() || initialDB;
                                docRef.set(initial);
                            }
                            setUseFirebase(true);
                            setIsSyncing(false);
                        },
                        (err) => {
                            console.error('[Firestore] Error:', err.code, '-', err.message);
                            console.error('[Firestore] Verifica las Reglas de Seguridad y que Anonymous Auth esté habilitado en Firebase Console.');
                            setIsSyncing(false);
                        }
                    );
                    unsubscribeRef.current = unsub;
                };

                // Intenta auth anónima; falle o no, arranca el listener
                const doAuth = () => auth
                    .setPersistence(firebase.auth.Auth.Persistence.SESSION)
                    .then(() => auth.signInAnonymously())
                    .then(() => {
                        console.log('[Firebase] Auth anónima OK. uid:', auth.currentUser?.uid);
                        setUser(auth.currentUser);
                        startListening();
                    })
                    .catch((e) => {
                        console.warn('[Firebase] Auth falló:', e.code, '-', e.message);
                        startListening();
                    });
                doAuth();

                return () => { if (unsubscribeRef.current) unsubscribeRef.current(); };
            }, []);

            // Match selector
            useEffect(() => {
                if (dbState.matches && dbState.matches.length > 0) {
                    const isValid = dbState.matches.some(m => m.id === selectedMatchId);
                    if (!selectedMatchId || !isValid) {
                        const upcoming = dbState.matches.find(m => m.status === 'upcoming');
                        if (upcoming) setSelectedMatchId(upcoming.id);
                        else {
                            const latest = [...dbState.matches].sort((a,b) => b.date.localeCompare(a.date))[0];
                            if (latest) setSelectedMatchId(latest.id);
                        }
                    }
                } else if (dbState.matches && dbState.matches.length === 0) {
                    setSelectedMatchId(null);
                }
            }, [dbState.matches, selectedMatchId]);

            const updateState = useCallback(async (newState) => {
                setDbState(newState);
                saveToLS(newState);
                if (!firebaseRef.current) return;
                try { await firebaseRef.current.docRef.set(newState); } catch(e) { console.error(e); }
            }, []);

            const updateCurrentMatch = useCallback((updatedMatch) => {
                updateState({ ...dbState, matches: dbState.matches.map(m => m.id === updatedMatch.id ? updatedMatch : m) });
            }, [dbState, updateState]);

            const createNewMatch = () => {
                const todayStr = new Date().toISOString().split('T')[0];
                const newMatch = { id: Date.now().toString(), date: todayStr, startTime: "20:00", endTime: "22:00", location: "Cancha El Golazo", mapUrl: "", quota: 11.50, deadlineDate: todayStr, deadlineTime: "18:00", status: "upcoming", attendees: {}, teams: {}, goals: [] };
                updateState({ ...dbState, matches: [newMatch, ...(dbState.matches || [])] });
                setSelectedMatchId(newMatch.id);
            };

            const deleteMatch = (matchId) => {
                const newMatches = dbState.matches.filter(m => m.id !== matchId);
                updateState({ ...dbState, matches: newMatches });
                if (selectedMatchId === matchId) {
                    if (newMatches.length > 0) {
                        const upcoming = newMatches.find(m => m.status === 'upcoming');
                        setSelectedMatchId(upcoming ? upcoming.id : [...newMatches].sort((a,b) => b.date.localeCompare(a.date))[0].id);
                    } else setSelectedMatchId(null);
                }
            };

            const computedPlayers = useMemo(() => {
                const players = dbState.players || [];
                const matches = dbState.matches || [];
                return players.map(p => {
                    let computedMatches = p.baseMatches || 0, points = p.basePoints || 0, goals = p.baseGoals || 0, wins = p.baseWins || 0, teamMatches = 0;
                    matches.forEach(m => {
                        if (m.status === 'completed') {
                            const status = m.attendees?.[p.id];
                            if (status === 'full') { computedMatches += 1; points += 1; }
                            else if (status === 'half') { computedMatches += 1; points += 0.5; }
                            else if (status === 'absent') { computedMatches += 1; }
                            goals += (m.goals || []).filter(g => g.playerId === p.id).length;
                            const team = m.teams?.[p.id];
                            if (team && (status === 'full' || status === 'half' || status === 'free')) {
                                teamMatches += 1;
                                const scoreA = (m.goals || []).filter(g => g.team === 'A').length;
                                const scoreB = (m.goals || []).filter(g => g.team === 'B').length;
                                if ((team === 'A' && scoreA > scoreB) || (team === 'B' && scoreB > scoreA)) wins += 1;
                            }
                        }
                    });
                    const attendancePerc = computedMatches > 0 ? (points / computedMatches) * 100 : 0;
                    const winPerc = teamMatches > 0 ? (wins / teamMatches) * 100 : 0;
                    let tier = 'C', tierColor = 'text-red-400', tierBg = 'bg-red-400/10 border-red-400/20';
                    if (attendancePerc >= 75) { tier = 'S'; tierColor = 'text-pitch-400'; tierBg = 'bg-pitch-400/10 border-pitch-400/20'; }
                    else if (attendancePerc >= 50) { tier = 'A'; tierColor = 'text-blue-400'; tierBg = 'bg-blue-400/10 border-blue-400/20'; }
                    else if (attendancePerc >= 25) { tier = 'B'; tierColor = 'text-gold'; tierBg = 'bg-gold/10 border-gold/20'; }
                    return { ...p, computedMatches, points, totalGoals: goals, wins, teamMatches, attendancePerc, winPerc, tier, tierColor, tierBg };
                });
            }, [dbState.players, dbState.matches]);

            const handleLogin = () => {
                const adminCreds = dbState.adminCredentials || { username: 'admin', password: '1234' };
                if (loginUser === adminCreds.username && loginPass === adminCreds.password) {
                    setIsAdmin(true); setLoggedPlayerId(null);
                    setShowLogin(false); setLoginUser(''); setLoginPass(''); setLoginError('');
                } else {
                    const player = dbState.players.find(p => p.username === loginUser && p.password === loginPass);
                    if (player) {
                        setIsAdmin(false); setLoggedPlayerId(player.id);
                        setShowLogin(false); setLoginUser(''); setLoginPass(''); setLoginError('');
                    } else {
                        setLoginError('Usuario o contraseña incorrectos');
                    }
                }
            };

            const handleLogout = () => { setIsAdmin(false); setLoggedPlayerId(null); };

            useEffect(() => { if (showAdminConfig) setAdminConfigForm(dbState.adminCredentials || { username: 'admin', password: '1234' }); }, [showAdminConfig]);
            useEffect(() => {
                if (showProfileConfig && loggedPlayerId) {
                    const p = computedPlayers.find(x => x.id === loggedPlayerId);
                    if (p) setPlayerConfigForm(p);
                }
            }, [showProfileConfig, loggedPlayerId]);

            const handleSaveAdminConfig = () => { updateState({ ...dbState, adminCredentials: adminConfigForm }); setShowAdminConfig(false); };
            const handleSavePlayerProfile = () => {
                const newPlayers = dbState.players.map(p => p.id === loggedPlayerId ? { ...p, ...playerConfigForm } : p);
                updateState({ ...dbState, players: newPlayers });
                setShowProfileConfig(false);
            };

            const handleExportDB = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dbState, null, 2));
                const a = document.createElement('a');
                a.setAttribute("href", dataStr); a.setAttribute("download", `pichanga_db_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(a); a.click(); a.remove();
            };

            const handleImportDB = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const newDb = JSON.parse(e.target.result);
                        if(newDb.players && (newDb.match || newDb.matches)) updateState(newDb);
                    } catch (err) { console.error(err); }
                };
                reader.readAsText(file);
                event.target.value = null;
            };

            if (isSyncing) {
                return (
                    <div className="min-h-screen bg-stone-900 flex items-center justify-center">
                        <div className="text-center">
                            <i className="ph-fill ph-soccer-ball text-6xl text-pitch-500 animate-spin mb-4 block"></i>
                            <p className="text-pitch-400 font-bold animate-pulse">Cargando...</p>
                        </div>
                    </div>
                );
            }

            const currentMatch = dbState.matches?.find(m => m.id === selectedMatchId);

            const myHistory = dbState.matches?.filter(m => m.status === 'completed' && m.attendees?.[loggedPlayerId]).map(m => {
                const st = m.attendees[loggedPlayerId];
                const g = (m.goals || []).filter(x => x.playerId === loggedPlayerId).length;
                const t = m.teams?.[loggedPlayerId];
                let won = false;
                if (t) {
                    const sA = (m.goals||[]).filter(x => x.team==='A').length; const sB = (m.goals||[]).filter(x => x.team==='B').length;
                    if ((t==='A' && sA>sB) || (t==='B' && sB>sA)) won = true;
                }
                return { match: m, status: st, goals: g, team: t, won };
            }) || [];

            return (
                <div className="min-h-screen pb-12 font-sans selection:bg-pitch-500 selection:text-white">
                    {/* Header */}
                    <header className="bg-stone-900 border-b border-stone-800 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-5xl mx-auto px-4 py-[18px] sm:py-4 flex flex-row justify-between items-center gap-3 sm:gap-4">
                            <div className="flex items-center gap-3 sm:gap-3">
                                <div className="bg-gradient-to-br from-pitch-500 to-pitch-700 p-2.5 sm:p-2.5 rounded-xl text-white shadow-lg shadow-pitch-900/50 border border-pitch-400/30 shrink-0">
                                    <i className="ph-fill ph-soccer-ball text-2xl sm:text-2xl"></i>
                                </div>
                                <div>
                                    <h1 className="text-[17px] sm:text-xl font-bold text-choco-200 tracking-tight leading-tight">Pichanga Chocolatera</h1>
                                    <p className="text-[11px] sm:text-xs text-pitch-400 font-medium">Gestor de Asistencias Oficial</p>
                                </div>
                            </div>
                            <div className="flex gap-1.5 sm:gap-2 shrink-0">
                                {!isAdmin && !loggedPlayerId && (
                                    <button onClick={() => setShowLogin(true)} className="flex items-center justify-center gap-1.5 sm:gap-2 px-3.5 sm:px-6 py-2.5 sm:py-3 rounded-lg font-bold transition-colors bg-stone-800 text-stone-300 hover:text-white hover:bg-stone-700 border border-stone-700 shadow-sm text-[13px] sm:text-base whitespace-nowrap">
                                        <i className="ph-fill ph-sign-in text-sm sm:text-lg"></i> <span>Ingresar</span>
                                    </button>
                                )}
                                {loggedPlayerId && (
                                    <button onClick={() => setShowProfileConfig(true)} className="flex items-center justify-center gap-1.5 sm:gap-2 px-3.5 sm:px-6 py-2.5 sm:py-3 rounded-lg font-bold transition-colors bg-pitch-900/50 text-pitch-400 border border-pitch-700 hover:bg-pitch-800 shadow-sm text-[13px] sm:text-base whitespace-nowrap">
                                        <i className="ph-fill ph-user text-sm sm:text-lg"></i> <span>Mi Perfil</span>
                                    </button>
                                )}
                                {isAdmin && (
                                    <button onClick={() => setShowAdminConfig(true)} className="flex items-center justify-center gap-1.5 sm:gap-2 px-3.5 sm:px-6 py-2.5 sm:py-3 rounded-lg font-bold transition-colors bg-choco-900/50 text-choco-400 border border-choco-700 hover:bg-choco-800 shadow-sm text-[13px] sm:text-base whitespace-nowrap">
                                        <i className="ph-fill ph-gear text-sm sm:text-lg"></i> <span className="hidden sm:inline">Admin Config</span><span className="sm:hidden">Admin</span>
                                    </button>
                                )}
                                {(isAdmin || loggedPlayerId) && (
                                    <button onClick={handleLogout} title="Cerrar Sesión" className="flex items-center justify-center px-3 sm:px-4 py-2.5 sm:py-3 rounded-lg font-bold transition-colors bg-stone-800 text-stone-400 hover:text-red-300 hover:bg-red-900/50 border border-stone-700">
                                        <i className="ph-fill ph-sign-out text-base sm:text-xl"></i>
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Barra de selección de fecha — sticky solo en sm+, no en mobile */}
                    <div className="bg-stone-800/80 backdrop-blur-md border-b border-stone-700 py-3 px-4 z-30 sm:sticky sm:top-[73px] shadow-sm">
                        <div className="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
                            <div className="flex items-center gap-2 text-stone-300 font-semibold text-sm">
                                <i className="ph-fill ph-calendar-check text-xl text-pitch-500"></i> Mostrando Pichanga del:
                            </div>
                            <div className="flex w-full sm:w-auto gap-2">
                                <select value={selectedMatchId || ''} onChange={e => setSelectedMatchId(e.target.value)} className="bg-stone-900 border border-stone-600 rounded-lg p-2.5 text-white outline-none flex-1 font-medium text-sm capitalize">
                                    {(dbState.matches || []).sort((a,b) => b.date.localeCompare(a.date)).map(m => (
                                        <option className="bg-stone-900 text-white" key={m.id} value={m.id}>{formatDateText(m.date) || m.date || 'Fecha por definir'} {m.status==='completed' ? '(Finalizada)' : '(Próxima)'}</option>
                                    ))}
                                </select>
                                {isAdmin && (
                                    <button onClick={createNewMatch} className="bg-pitch-600 hover:bg-pitch-500 text-white px-3 py-2 rounded-lg font-bold transition-colors shadow-lg shrink-0 flex items-center gap-1 text-sm" title="Programar Nueva Pichanga">
                                        <i className="ph-bold ph-plus"></i> Nueva
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>

                    <main className="max-w-5xl mx-auto px-4 py-8 space-y-8">
                        {(!currentMatch && (!dbState.matches || dbState.matches.length === 0)) && (
                            <section className="bg-stone-800 rounded-2xl p-6 shadow-xl border border-stone-700/50 text-center">
                                <i className="ph-fill ph-calendar-blank text-6xl text-stone-600 mb-4 block"></i>
                                <h2 className="text-xl font-bold text-stone-300 mb-2">No hay pichangas registradas</h2>
                                <p className="text-stone-500 text-sm mb-6">El administrador aún no ha programado la próxima fecha o no hay historial de partidos.</p>
                                {isAdmin && (
                                    <button onClick={createNewMatch} className="bg-pitch-600 hover:bg-pitch-500 text-white px-6 py-3 rounded-lg font-bold transition-colors shadow-lg inline-flex items-center gap-2 justify-center">
                                        <i className="ph-bold ph-plus"></i> Programar Nueva Pichanga
                                    </button>
                                )}
                            </section>
                        )}

                        {currentMatch?.status === 'completed' && (
                            <MatchHighlightsSection currentMatch={currentMatch} updateCurrentMatch={updateCurrentMatch} computedPlayers={computedPlayers} isAdmin={isAdmin} loggedPlayerId={loggedPlayerId} />
                        )}

                        {currentMatch?.status === 'upcoming' && (
                            <>
                                <MatchInfoSection currentMatch={currentMatch} updateCurrentMatch={updateCurrentMatch} deleteMatch={deleteMatch} isAdmin={isAdmin} />
                                <CurrentRosterSection currentMatch={currentMatch} updateCurrentMatch={updateCurrentMatch} computedPlayers={computedPlayers} isAdmin={isAdmin} />
                            </>
                        )}

                        {currentMatch?.status === 'completed' && isAdmin && (
                            <details className="border border-stone-700 rounded-xl bg-stone-900/30 group overflow-hidden shadow-inner">
                                <summary className="p-4 cursor-pointer text-stone-400 hover:text-white font-bold outline-none flex items-center gap-2 hover:bg-stone-800/50 transition-colors">
                                    <i className="ph-fill ph-pencil-simple text-pitch-500"></i> Administrar/Editar datos de este partido finalizado
                                </summary>
                                <div className="p-4 sm:p-6 space-y-8 border-t border-stone-700">
                                    <MatchInfoSection currentMatch={currentMatch} updateCurrentMatch={updateCurrentMatch} deleteMatch={deleteMatch} isAdmin={isAdmin} />
                                    <CurrentRosterSection currentMatch={currentMatch} updateCurrentMatch={updateCurrentMatch} computedPlayers={computedPlayers} isAdmin={isAdmin} />
                                </div>
                            </details>
                        )}

                        {currentMatch && (
                            <MatchBoardSection currentMatch={currentMatch} updateCurrentMatch={updateCurrentMatch} computedPlayers={computedPlayers} isAdmin={isAdmin} />
                        )}

                        {isAdmin && <AdminPanel dbState={dbState} updateState={updateState} computedPlayers={computedPlayers} handleExportDB={handleExportDB} handleImportDB={handleImportDB} />}

                        <LeaderboardSection computedPlayers={computedPlayers} isAdmin={isAdmin} />
                    </main>

                    {/* Modal Login */}
                    <Modal isOpen={showLogin} onClose={() => {setShowLogin(false); setLoginError('');}} title="Ingresar a la Cancha">
                        <div className="space-y-4">
                            <p className="text-stone-400 text-sm">Ingresa con tu usuario y contraseña. Si eres admin, usa tus credenciales maestras.</p>
                            {loginError && <p className="text-red-400 text-sm font-bold bg-red-900/20 p-2 rounded border border-red-700/50">{loginError}</p>}
                            <div className="relative mb-3">
                                <i className="ph ph-user absolute left-3 top-1/2 -translate-y-1/2 text-stone-500 text-xl"></i>
                                <input type="text" placeholder="Usuario" value={loginUser} onChange={e => setLoginUser(e.target.value)} className="w-full bg-stone-900 border border-stone-700 rounded-lg py-3 pl-10 pr-3 text-white focus:border-pitch-500 outline-none" />
                            </div>
                            <div className="relative">
                                <i className="ph ph-password absolute left-3 top-1/2 -translate-y-1/2 text-stone-500 text-xl"></i>
                                <input type="password" placeholder="Contraseña" value={loginPass} onChange={e => setLoginPass(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLogin()} className="w-full bg-stone-900 border border-stone-700 rounded-lg py-3 pl-10 pr-3 text-white focus:border-pitch-500 outline-none" />
                            </div>
                            <button onClick={handleLogin} className="w-full bg-pitch-600 hover:bg-pitch-500 py-3 rounded-lg text-white font-bold transition-colors shadow-lg shadow-pitch-900/50">Ingresar</button>
                        </div>
                    </Modal>

                    {/* Modal Admin Config */}
                    <Modal isOpen={showAdminConfig} onClose={() => setShowAdminConfig(false)} title="Configuración de Administrador">
                        <div className="space-y-4">
                            <p className="text-stone-400 text-sm">Actualiza tus credenciales maestras. ¡No las olvides!</p>
                            <div><label className="block text-sm text-stone-400 mb-1">Nuevo Usuario Admin</label><input type="text" value={adminConfigForm.username || ''} onChange={e => setAdminConfigForm({...adminConfigForm, username: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white focus:border-pitch-500 outline-none" /></div>
                            <div><label className="block text-sm text-stone-400 mb-1">Nueva Contraseña Admin</label><input type="text" value={adminConfigForm.password || ''} onChange={e => setAdminConfigForm({...adminConfigForm, password: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white focus:border-pitch-500 outline-none" /></div>
                            <button onClick={handleSaveAdminConfig} className="w-full bg-choco-600 hover:bg-choco-500 py-3 rounded-lg text-white font-bold mt-4 transition-colors">Guardar Credenciales</button>
                        </div>
                    </Modal>

                    {/* Modal Perfil */}
                    <Modal isOpen={showProfileConfig} onClose={() => setShowProfileConfig(false)} title="Mi Perfil Chocolatero">
                        <div className="space-y-4 max-h-[75vh] overflow-y-auto custom-scrollbar pr-2">
                            <div className="flex justify-center mb-4 relative">
                                <PlayerAvatar player={playerConfigForm} className="w-24 h-24 text-3xl shadow-xl" />
                                <label className="absolute bottom-0 right-1/2 translate-x-12 translate-y-2 bg-pitch-600 hover:bg-pitch-500 text-white p-2 rounded-full cursor-pointer shadow-lg border-2 border-stone-800 transition-colors" title="Seleccionar archivo">
                                    <i className="ph-fill ph-camera text-lg"></i>
                                    <input type="file" accept="image/*" onChange={e => { if(e.target.files[0]) setProfileCropFile(e.target.files[0]); e.target.value = ''; }} className="hidden" />
                                </label>
                                <button type="button" onClick={async () => {
                                    try {
                                        const items = await navigator.clipboard.read();
                                        for (const item of items) {
                                            const t = item.types.find(x => x.startsWith('image/'));
                                            if (t) { const blob = await item.getType(t); setProfileCropFile(new File([blob],'pasted.png',{type:t})); break; }
                                        }
                                    } catch { alert('Presiona Ctrl+V en cualquier parte de esta ventana para pegar.'); }
                                }} className="absolute bottom-0 right-1/2 translate-x-[52px] translate-y-8 bg-stone-700 hover:bg-stone-600 text-stone-300 p-1.5 rounded-full cursor-pointer shadow-lg border-2 border-stone-800 transition-colors" title="Pegar imagen (Ctrl+V)">
                                    📋
                                </button>
                            </div>
                            <div className="text-center">
                                {playerConfigForm.photoUrl && <button onClick={() => setPlayerConfigForm({...playerConfigForm, photoUrl: ''})} className="text-xs text-red-400 hover:text-red-300 font-semibold"><i className="ph ph-trash"></i> Eliminar foto actual</button>}
                            </div>
                            <div className="bg-stone-900/50 p-4 rounded-xl border border-stone-700 grid grid-cols-3 text-center mb-2">
                                <div><p className="text-[10px] text-stone-400 uppercase tracking-widest">% Asist</p><p className="text-xl font-black text-pitch-400">{playerConfigForm.attendancePerc?.toFixed(0)}%</p></div>
                                <div className="border-x border-stone-700"><p className="text-[10px] text-stone-400 uppercase tracking-widest">Goles</p><p className="text-xl font-black text-white">{playerConfigForm.totalGoals}</p></div>
                                <div><p className="text-[10px] text-stone-400 uppercase tracking-widest">% Win</p><p className="text-xl font-black text-blue-400">{playerConfigForm.winPerc?.toFixed(0)}%</p></div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div><label className="block text-sm text-stone-400 mb-1">Nombre</label><input type="text" value={playerConfigForm.name || ''} onChange={e => setPlayerConfigForm({...playerConfigForm, name: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white focus:border-pitch-500 outline-none" /></div>
                                <div><label className="block text-sm text-stone-400 mb-1">Apellido</label><input type="text" value={playerConfigForm.lastName || ''} onChange={e => setPlayerConfigForm({...playerConfigForm, lastName: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white focus:border-pitch-500 outline-none" /></div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div><label className="block text-sm text-stone-400 mb-1">Alias (Apodo)</label><input type="text" value={playerConfigForm.alias || ''} onChange={e => setPlayerConfigForm({...playerConfigForm, alias: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white focus:border-pitch-500 outline-none" /></div>
                                <div><label className="block text-sm text-stone-400 mb-1">Celular / WA</label><input type="text" value={playerConfigForm.phone || ''} onChange={e => setPlayerConfigForm({...playerConfigForm, phone: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white focus:border-pitch-500 outline-none" /></div>
                            </div>
                            <div>
                                <label className="block text-sm text-stone-400 mb-1">Mi Posición en Cancha</label>
                                <select value={playerConfigForm.position || ''} onChange={e => setPlayerConfigForm({...playerConfigForm, position: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white focus:border-pitch-500 outline-none text-sm">
                                    <option value="">No definida</option>
                                    <option value="ARQ">Arquero (ARQ)</option>
                                    <option value="DEF">Defensa (DEF)</option>
                                    <option value="MED">Medio (MED)</option>
                                    <option value="DEL">Delantero (DEL)</option>
                                </select>
                            </div>
                            <div className="bg-stone-900/50 p-3 rounded-lg border border-stone-700 mt-2">
                                <p className="text-sm text-pitch-400 font-bold mb-2">Seguridad</p>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div><label className="block text-xs text-stone-400 mb-1">Usuario (Fijo)</label><input type="text" value={playerConfigForm.username || ''} disabled className="w-full bg-stone-800 border border-stone-700 rounded-lg p-2 text-stone-500 outline-none cursor-not-allowed" /></div>
                                    <div><label className="block text-xs text-stone-400 mb-1">Nueva Contraseña</label><input type="text" value={playerConfigForm.password || ''} onChange={e => setPlayerConfigForm({...playerConfigForm, password: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white focus:border-pitch-500 outline-none" /></div>
                                </div>
                            </div>
                            <div className="mt-6 pt-4 border-t border-stone-700">
                                <h4 className="text-white font-bold mb-3 flex items-center gap-2"><i className="ph-fill ph-clock-counter-clockwise text-pitch-400"></i> Mi Historial de Asistencias</h4>
                                {myHistory.length === 0 ? (
                                    <p className="text-sm text-stone-500 text-center py-4 border border-dashed border-stone-700 rounded-xl">Aún no tienes registro de partidos finalizados.</p>
                                ) : (
                                    <div className="space-y-2">
                                        {myHistory.map((h, i) => (
                                            <div key={i} className="bg-stone-900 p-3 rounded-xl border border-stone-700 text-sm flex justify-between items-center">
                                                <div>
                                                    <p className="font-bold text-stone-200">{h.match.date}</p>
                                                    <p className="text-xs text-stone-400 mt-1">
                                                        {h.status === 'full' && <span className="text-pitch-400">Asistencia Completa</span>}
                                                        {h.status === 'half' && <span className="text-gold">Medio Cupo</span>}
                                                        {h.status === 'absent' && <span className="text-red-400">Faltó</span>}
                                                        {h.status === 'excused' && <span className="text-stone-400">Justificado</span>}
                                                        {h.status === 'free' && <span className="text-blue-400">Gratis/Invitado</span>}
                                                    </p>
                                                </div>
                                                <div className="text-right">
                                                    {h.team && <p className={`text-xs font-bold ${h.won ? 'text-blue-400' : 'text-stone-500'}`}>{h.won ? '🏆 Victoria' : 'Derrota'}</p>}
                                                    {h.goals > 0 && <p className="text-xs font-bold text-pitch-400 mt-1">⚽ {h.goals} Goles</p>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <button onClick={handleSavePlayerProfile} className="w-full bg-pitch-600 hover:bg-pitch-500 py-3 rounded-lg text-white font-bold mt-4 transition-colors sticky bottom-0">Guardar Mis Cambios</button>
                        </div>
                    </Modal>

                    {profileCropFile && <ImageCropperModal file={profileCropFile} onCropped={(dataUrl) => { setPlayerConfigForm({...playerConfigForm, photoUrl: dataUrl}); setProfileCropFile(null); }} onCancel={() => setProfileCropFile(null)} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
