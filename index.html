<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pichanga Chocolatera</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBinanH1KCpAYL58VQBT2KKCOnzUFMhof8",
            authDomain: "pichanga-chocolatera.firebaseapp.com",
            projectId: "pichanga-chocolatera",
            storageBucket: "pichanga-chocolatera.firebasestorage.app",
            messagingSenderId: "27861650922",
            appId: "1:27861650922:web:bf670c886d54f358c57693"
        };
        const app = initializeApp(firebaseConfig);
        window.firebaseVars = { 
            auth: getAuth(app), 
            db: getFirestore(app), 
            doc, setDoc, onSnapshot, collection, 
            signInAnonymously, signInWithCustomToken, 
            appId: firebaseConfig.appId 
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { background-color: #1c1917; color: #e7e5e4; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #292524; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #57534e; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const initialDB = { adminCredentials: { username: "admin", password: "1234" }, players: [], matches: [] };
        
        function App() {
            const [dbState, setDbState] = useState(initialDB);
            const [isSyncing, setIsSyncing] = useState(true);

            useEffect(() => {
                const initApp = async () => {
                    if (!window.firebaseVars) { setTimeout(initApp, 100); return; }
                    const { auth, signInAnonymously } = window.firebaseVars;
                    await signInAnonymously(auth);
                    
                    const { db, doc, onSnapshot, appId, setDoc } = window.firebaseVars;
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'app_state', 'current');
                    onSnapshot(docRef, (snapshot) => {
                        if (snapshot.exists()) setDbState(snapshot.data());
                        else setDoc(docRef, initialDB);
                        setIsSyncing(false);
                    });
                };
                initApp();
            }, []);

            if (isSyncing) return <div className="text-white p-10">Cargando Pichanga...</div>;
            return <div className="p-4 text-white">¡Página Conectada! (Datos: {dbState.players.length} jugadores)</div>;
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
