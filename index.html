                                    ) : (
                                        <div className="text-center text-stone-500 flex flex-col items-center mt-6">
                                            <i className="ph-fill ph-scales text-3xl sm:text-5xl text-stone-600 mb-2"></i>
                                            <p className="text-[10px] sm:text-sm font-bold leading-tight text-stone-400">Empate<br/>en goles</p>
                                        </div>
                                    )}
                                </>
                            ) : topScorer ? (
                                <>
                                    {currentMatch.manualTopScorerId && isAdmin && candidates.length > 1 && (
                                        <button onClick={() => updateCurrentMatch({...currentMatch, manualTopScorerId: null})} className="absolute top-1 right-1 sm:top-2 sm:right-2 text-stone-500 hover:text-red-400"><i className="ph ph-arrow-counter-clockwise"></i></button>
                                    )}
                                    <div className="flex flex-col items-center mt-3 sm:mt-5 w-full flex-1">
                                        <div className="relative">
                                            <PlayerAvatar player={topScorer.player} className="w-16 h-16 sm:w-20 sm:h-20 text-xl sm:text-2xl shadow-xl border-2 border-stone-500" />
                                            <div className="absolute -bottom-1 -right-1 sm:-bottom-2 sm:-right-2 bg-stone-900 rounded-full p-1 border border-stone-600">
                                                <i className="ph-fill ph-soccer-ball text-sm sm:text-xl text-stone-300"></i>
                                            </div>
                                        </div>
                                        <p className="text-white font-bold text-xs sm:text-base mt-3 text-center leading-tight truncate w-full px-1">{formatPlayerName(topScorer.player, true)}</p>
                                        <p className="text-stone-300 font-black text-sm sm:text-lg mt-1 flex items-center gap-1 justify-center"><i className="ph-fill ph-soccer-ball"></i> {topScorer.count} {topScorer.count === 1 ? 'Gol' : 'Goles'}</p>
                                        {topScorer.team && <p className={`text-[10px] sm:text-xs font-bold mt-1 uppercase tracking-wider ${topScorer.team === 'A' ? 'text-blue-400' : 'text-red-400'}`}>Equipo {topScorer.team === 'A' ? 'Azul' : 'Rojo'}</p>}
                                    </div>
                                </>
                            ) : (
                                <div className="text-center text-stone-500 flex flex-col items-center mt-6">
                                    <i className="ph ph-mask-sad text-3xl sm:text-5xl mb-2"></i>
                                    <p className="text-[10px] sm:text-sm font-bold leading-tight">Sin goles</p>
                                </div>
                            )}
                        </div>

                        {/* MVP */}
                        <div className="relative bg-gradient-to-t from-amber-900/20 to-stone-900/80 border border-gold/50 p-3 sm:p-4 flex flex-col items-center justify-start col-span-1 rounded-2xl shadow-[0_0_15px_rgba(251,191,36,0.15)] mt-4 mb-4 sm:mt-6 sm:mb-6 min-h-[220px] sm:min-h-[240px]">
                            <div className="absolute -top-3 sm:-top-4 left-1/2 -translate-x-1/2 bg-gold text-stone-900 text-[9px] sm:text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider shadow-md whitespace-nowrap z-10 flex items-center gap-1">
                                <i className="ph-fill ph-star"></i> MVP OFICIAL
                            </div>
                            {isAdmin && (
                                <div className="absolute top-1 right-1 sm:top-2 sm:right-2 flex overflow-hidden rounded border border-stone-700 text-[7px] sm:text-[9px] font-bold z-20 shadow-md">
                                    <button onClick={() => updateCurrentMatch({ ...currentMatch, mvpMode: 'manual' })} className={`px-1.5 py-0.5 sm:px-2 sm:py-1 transition-colors ${!isVoting ? 'bg-gold text-stone-900' : 'bg-stone-800 text-stone-400 hover:bg-stone-700'}`}>Manual</button>
                                    <button onClick={() => updateCurrentMatch({ ...currentMatch, mvpMode: 'voting' })} className={`px-1.5 py-0.5 sm:px-2 sm:py-1 transition-colors ${isVoting ? 'bg-gold text-stone-900' : 'bg-stone-800 text-stone-400 hover:bg-stone-700'}`}>Votos</button>
                                </div>
                            )}
                            {mvpPlayer ? (
                                <div className="flex flex-col items-center mt-4 sm:mt-6 w-full flex-1">
                                    <div className="relative">
                                        <PlayerAvatar player={mvpPlayer} className="w-16 h-16 sm:w-20 sm:h-20 text-xl sm:text-2xl shadow-xl border-2 border-gold" />
                                        <div className="absolute -bottom-1 -right-1 sm:-bottom-2 sm:-right-2 bg-stone-900 rounded-full p-1 border border-stone-600">
                                            <i className="ph-fill ph-star text-sm sm:text-xl text-gold"></i>
                                        </div>
                                    </div>
                                    <p className="text-white font-bold text-xs sm:text-base mt-3 text-center leading-tight truncate w-full px-1">{formatPlayerName(mvpPlayer, true)}</p>
                                    <p className="text-gold font-black text-sm sm:text-lg mt-1 flex items-center gap-1 justify-center"><i className="ph-fill ph-medal text-gold"></i> Tier {mvpPlayer.tier || 'C'}</p>
                                    {isVoting ? (
                                        <p className="text-gold text-[10px] sm:text-xs font-bold mt-1 uppercase tracking-wider">{Object.values(currentMatch.mvpVotes || {}).filter(v=>v===mvpPlayer.id).length} {Object.values(currentMatch.mvpVotes || {}).filter(v=>v===mvpPlayer.id).length === 1 ? 'Voto' : 'Votos'}</p>
                                    ) : (
                                        <p className="text-gold text-[10px] sm:text-xs font-bold mt-1 uppercase tracking-wider">Destacado</p>
                                    )}
                                </div>
                            ) : tiedMvps.length > 0 ? (
                                <div className="text-center text-stone-400 flex flex-col items-center mt-6">
                                    <i className="ph-fill ph-users text-3xl sm:text-5xl text-gold mb-2 drop-shadow-md"></i>
                                    <p className="text-[10px] sm:text-xs font-black leading-tight text-gold">Empate de votos</p>
                                </div>
                            ) : (
                                <div className="text-center text-stone-500 flex flex-col items-center mt-6">
                                    <i className="ph ph-user-circle-dashed text-3xl sm:text-5xl mb-2 drop-shadow-sm"></i>
                                    <p className="text-[10px] sm:text-sm font-bold leading-tight">Por definir</p>
                                </div>
                            )}
                            <div className="mt-auto pt-2 w-full relative z-30" data-html2canvas-ignore="true">
                                {!isVoting && isAdmin && (
                                    <select value={currentMatch.mvpId || ''} onChange={(e) => updateCurrentMatch({...currentMatch, mvpId: e.target.value})} className="w-full bg-stone-900 border border-gold/50 rounded p-1 text-gold outline-none text-[9px] sm:text-xs text-center font-bold shadow-lg">
                                        <option className="bg-stone-900 text-white" value="">Elegir MVP...</option>
                                        {attendees.map(p => <option className="bg-stone-900 text-white" key={p.id} value={p.id}>{p.name}</option>)}
                                    </select>
                                )}
                                {isVoting && loggedPlayerId && iAttended && (
                                    <select value={myVote} onChange={(e) => updateCurrentMatch({...currentMatch, mvpVotes: {...(currentMatch.mvpVotes||{}), [loggedPlayerId]: e.target.value}})} className="w-full bg-amber-900/30 border border-gold/50 rounded p-1 text-gold outline-none text-[9px] sm:text-xs text-center font-bold shadow-lg">
                                        <option className="bg-stone-900 text-gold" value="">Tu Voto MVP...</option>
                                        {attendees.map(p => <option className="bg-stone-900 text-gold" key={p.id} value={p.id}>{p.name}</option>)}
                                    </select>
                                )}
                                {isVoting && (!loggedPlayerId || !iAttended) && (
                                    <p className="text-[8px] sm:text-[9px] text-stone-500 font-bold text-center px-1">Votación abierta a jugadores.</p>
                                )}
                            </div>
                        </div>

                        {/* Goleadores */}
                        <div className="bg-stone-900/80 border border-stone-700 p-3 sm:p-5 rounded-2xl col-span-2 md:col-span-4 shadow-inner flex flex-col max-h-[140px] sm:max-h-[200px]">
                            <p className="text-stone-400 text-[10px] sm:text-sm font-bold uppercase tracking-widest mb-2 flex items-center gap-2">
                                <i className="ph-fill ph-list-numbers text-sm sm:text-lg text-pitch-400"></i> Tabla de Goles
                            </p>
                            <div className="overflow-y-auto custom-scrollbar pr-2 flex-1 space-y-1.5 sm:space-y-2">
                                {scorers.length > 0 ? scorers.map((s, idx) => (
                                    <div key={s.player.id} className="flex justify-between items-center bg-stone-800 p-1.5 sm:p-2 rounded-lg border border-stone-700/50">
                                        <div className="flex items-center gap-1.5 sm:gap-2">
                                            <span className="text-stone-500 font-bold text-[10px] sm:text-xs w-3 sm:w-4 text-right">{idx + 1}.</span>
                                            <PlayerAvatar player={s.player} className="w-5 h-5 sm:w-6 sm:h-6 text-[8px] sm:text-[10px]" />
                                            <span className="text-[10px] sm:text-sm font-medium text-stone-200 truncate max-w-[120px] sm:max-w-[200px]">{s.player.name} {s.player.lastName?.charAt(0)}.</span>
                                        </div>
                                        <div className="flex items-center gap-1 sm:gap-2">
                                            {s.team && <div className={`w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full ${s.team === 'A' ? 'bg-blue-400' : 'bg-red-400'}`}></div>}
                                            <span className="text-pitch-400 font-bold text-[10px] sm:text-sm">⚽ {s.count}</span>
                                        </div>
                                    </div>
                                )) : (
                                    <p className="text-stone-500 text-[10px] sm:text-sm text-center py-2">Nadie anotó en este encuentro.</p>
                                )}
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        // --- BOARD SECTION ---
        function MatchBoardSection({ currentMatch, updateCurrentMatch, computedPlayers, isAdmin }) {
            const [isDownloading, setIsDownloading] = useState(false);
            const [autoConfirm, setAutoConfirm] = useState(false);
            if (!currentMatch) return null;

            const isCompleted = currentMatch.status === 'completed';
            const attendeesMap = currentMatch.attendees || {};
            const teamsMap = currentMatch.teams || {};
            const goalsList = currentMatch.goals || [];

            const convocadosList = computedPlayers.filter(p => attendeesMap[p.id] && attendeesMap[p.id] !== 'none');
            const teamA = convocadosList.filter(p => teamsMap[p.id] === 'A');
            const teamB = convocadosList.filter(p => teamsMap[p.id] === 'B');
            const unassigned = convocadosList.filter(p => !teamsMap[p.id]);

            const scoreA = goalsList.filter(g => g.team === 'A').length;
            const scoreB = goalsList.filter(g => g.team === 'B').length;

            // ── Auto-asignación equitativa ──────────────────────────────
            const autoAssignTeams = () => {
                if (isCompleted || convocadosList.length === 0) return;

                // 1. Calcular fuerza de cada jugador (0-100)
                const POS_ORDER = { ARQ: 0, DEF: 1, MED: 2, DEL: 3, '': 4 };

                const scored = convocadosList.map(p => {
                    const hasStats = p.winPerc > 0 || p.totalGoals > 0;
                    const winScore   = p.winPerc       || 0;                  // 0-100
                    const goalScore  = Math.min((p.totalGoals || 0) * 4, 60); // max 60
                    const atndScore  = p.attendancePerc || 0;                  // 0-100
                    const strength   = hasStats
                        ? winScore * 0.5 + goalScore * 0.3 + atndScore * 0.2
                        : 0;
                    return { ...p, strength, pos: POS_ORDER[p.position] ?? 4 };
                });

                // 2. Separar ARQs y el resto
                const arqs  = scored.filter(p => p.position === 'ARQ').sort((a,b) => b.strength - a.strength);
                const rest  = scored.filter(p => p.position !== 'ARQ').sort((a,b) => b.strength - a.strength);

                const newTeams = {};

                // 3. Asignar ARQs: el mejor a A, siguiente a B, etc.
                arqs.forEach((p, i) => { newTeams[p.id] = i % 2 === 0 ? 'A' : 'B'; });

                // 4. Snake-draft para el resto: A B B A A B B A ...
                //    (garantiza que la suma de fuerza de ambos equipos sea similar)
                rest.forEach((p, i) => {
                    const round      = Math.floor(i / 2);
                    const posInRound = i % 2;
                    const team = (round % 2 === 0)
                        ? (posInRound === 0 ? 'A' : 'B')
                        : (posInRound === 0 ? 'B' : 'A');
                    newTeams[p.id] = team;
                });

                // 5. Balance de posiciones: si un equipo acumula todos los DEL,
                //    intercambiar el DEL más débil del equipo sobrado por el jugador
                //    más cercano en fuerza del otro equipo.
                const POS_TYPES = ['DEF', 'MED', 'DEL'];
                POS_TYPES.forEach(pos => {
                    const inA = rest.filter(p => p.position === pos && newTeams[p.id] === 'A');
                    const inB = rest.filter(p => p.position === pos && newTeams[p.id] === 'B');
                    if (inA.length - inB.length >= 2) {
                        // A tiene al menos 2 más de este pos → mover el más débil de A a B y swap
                        const weakA = inA[inA.length - 1];
                        const bPlayers = rest.filter(p => newTeams[p.id] === 'B' && p.position !== pos);
                        if (bPlayers.length > 0) {
                            const swapB = bPlayers.reduce((prev, cur) =>
                                Math.abs(cur.strength - weakA.strength) < Math.abs(prev.strength - weakA.strength) ? cur : prev);
                            newTeams[weakA.id] = 'B';
                            newTeams[swapB.id] = 'A';
                        }
                    } else if (inB.length - inA.length >= 2) {
                        const weakB = inB[inB.length - 1];
                        const aPlayers = rest.filter(p => newTeams[p.id] === 'A' && p.position !== pos);
                        if (aPlayers.length > 0) {
                            const swapA = aPlayers.reduce((prev, cur) =>
                                Math.abs(cur.strength - weakB.strength) < Math.abs(prev.strength - weakB.strength) ? cur : prev);
                            newTeams[weakB.id] = 'A';
                            newTeams[swapA.id] = 'B';
                        }
                    }
                });

                updateCurrentMatch({ ...currentMatch, teams: newTeams });
                setAutoConfirm(false);
            };
            // ───────────────────────────────────────────────────────────

            const handleAssignTeam = (playerId, team) => {
                if (isCompleted || !isAdmin) return;
                const newTeams = { ...teamsMap };
                if (!team) delete newTeams[playerId];
                else newTeams[playerId] = team;
                updateCurrentMatch({ ...currentMatch, teams: newTeams });
            };

            const handleAddGoal = (playerId, team) => {
                if (isCompleted || !isAdmin) return;
                updateCurrentMatch({ ...currentMatch, goals: [...goalsList, { id: Date.now().toString(), playerId, team }] });
            };

            const handleDecreaseGoal = (playerId, team) => {
                if (isCompleted || !isAdmin) return;
                const playerTeamGoals = goalsList.filter(g => g.playerId === playerId && g.team === team);
                if (playerTeamGoals.length === 0) return;
                const lastGoalId = playerTeamGoals[playerTeamGoals.length - 1].id;
                updateCurrentMatch({ ...currentMatch, goals: goalsList.filter(g => g.id !== lastGoalId) });
            };

            return (
                <section id="board-capture-area" className="bg-stone-800 rounded-2xl p-2 sm:p-6 shadow-xl border border-stone-700/50">
                    <div className="flex justify-between items-center mb-3 sm:mb-6 px-1 sm:px-0 gap-2">
                        <h2 className="text-base sm:text-2xl font-bold text-white flex items-center gap-1.5 sm:gap-2">
                            <i className="ph-fill ph-chalkboard-teacher text-blue-400"></i> Pizarra {isCompleted && '(Final)'}
                        </h2>
                        <div className="flex items-center gap-1.5 sm:gap-2" data-html2canvas-ignore="true">
                            {isAdmin && !isCompleted && (
                                autoConfirm ? (
                                    <div className="flex items-center gap-1 bg-purple-900/40 border border-purple-600 rounded-lg px-2 py-1">
                                        <span className="text-purple-300 text-[9px] sm:text-xs font-bold">¿Confirmar?</span>
                                        <button onClick={autoAssignTeams} className="bg-purple-600 hover:bg-purple-500 text-white px-1.5 py-0.5 rounded text-[9px] sm:text-xs font-bold transition-colors">Sí</button>
                                        <button onClick={() => setAutoConfirm(false)} className="bg-stone-700 hover:bg-stone-600 text-stone-300 px-1.5 py-0.5 rounded text-[9px] sm:text-xs font-bold transition-colors">No</button>
                                    </div>
                                ) : (
                                    <button onClick={() => setAutoConfirm(true)} className="bg-purple-700 hover:bg-purple-600 text-white px-2 sm:px-3 py-1 sm:py-2 rounded-lg font-semibold flex items-center gap-1 transition-colors shadow-md text-[10px] sm:text-sm border border-purple-500/50" title="Asignar equipos automáticamente de forma equitativa">
                                        <i className="ph-fill ph-magic-wand"></i> <span className="hidden sm:inline">Auto-Equipos</span><span className="sm:hidden">Auto</span>
                                    </button>
                                )
                            )}
                            {isAdmin && (
                                <button onClick={() => captureAndDownload('board-capture-area', `Pizarra_${currentMatch.date}`, setIsDownloading)} className="bg-pitch-600 hover:bg-pitch-500 text-white px-2 sm:px-4 py-1 sm:py-2 rounded-lg font-semibold flex items-center gap-1.5 transition-colors shadow-md text-[10px] sm:text-sm">
                                    {isDownloading ? <i className="ph ph-spinner animate-spin"></i> : <i className="ph ph-download-simple"></i>} JPG
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-1.5 sm:gap-6">
                        {[{team:'A', color:'blue', list:teamA, score:scoreA}, {team:'B', color:'red', list:teamB, score:scoreB}].map(({team, color, list, score}) => (
                            <div key={team} className={`bg-stone-900 border border-${color}-900/50 rounded-xl p-1.5 sm:p-4`}>
                                <div className="flex justify-between items-center mb-1.5 sm:mb-4 gap-1">
                                    <h3 className={`font-bold text-${color}-400 text-[10px] sm:text-lg`}>{team === 'A' ? 'Azul (A)' : 'Rojo (B)'}</h3>
                                    <span className={`text-lg sm:text-2xl font-black text-white bg-${color}-900/30 px-2 py-0.5 rounded-md`}>{score}</span>
                                </div>
                                <div className="space-y-1 sm:space-y-2 min-h-[60px] sm:min-h-[100px]">
                                    {list.map(p => {
                                        const pGoals = goalsList.filter(g => g.playerId === p.id && g.team === team);
                                        return (
                                            <div key={p.id} className="flex justify-between items-center bg-stone-800 p-1 sm:p-2 rounded border border-stone-700/30">
                                                <div className="flex items-center gap-1 sm:gap-2 min-w-0">
                                                    <span className="text-stone-300 text-[9px] sm:text-sm truncate">{p.name} {p.lastName?.charAt(0)}.</span>
                                                    {pGoals.length > 0 && <span className="text-[8px] sm:text-xs text-pitch-400 font-bold shrink-0">⚽x{pGoals.length}</span>}
                                                </div>
                                                <div className="flex gap-0.5 sm:gap-1 shrink-0" data-html2canvas-ignore="true">
                                                    {isAdmin && !isCompleted && pGoals.length > 0 && (
                                                        <button onClick={() => handleDecreaseGoal(p.id, team)} className="text-red-400 hover:text-red-300 bg-red-900/30 w-4 h-4 sm:w-6 sm:h-6 rounded flex items-center justify-center font-bold text-[10px] sm:text-xs">-</button>
                                                    )}
                                                    {isAdmin && !isCompleted && (
                                                        <button onClick={() => handleAddGoal(p.id, team)} className="text-pitch-400 hover:text-pitch-300 bg-pitch-900/30 w-4 h-4 sm:w-6 sm:h-6 rounded flex items-center justify-center font-bold text-[10px] sm:text-xs">+</button>
                                                    )}
                                                    {isAdmin && !isCompleted && (
                                                        <button onClick={() => handleAssignTeam(p.id, null)} className="text-stone-500 hover:text-stone-300 w-4 h-4 sm:w-6 sm:h-6 rounded flex items-center justify-center ml-0.5"><i className="ph ph-x text-[10px] sm:text-sm"></i></button>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* ── Indicador de Equidad ─────────────────────────── */}
                    {(teamA.length > 0 || teamB.length > 0) && (() => {
                        const calcStr = (p) => {
                            const hasStats = (p.winPerc || 0) > 0 || (p.totalGoals || 0) > 0;
                            if (!hasStats) return 20;
                            return (p.winPerc || 0) * 0.5
                                 + Math.min((p.totalGoals || 0) * 4, 60) * 0.3
                                 + (p.attendancePerc || 0) * 0.2;
                        };
                        const sumA  = teamA.reduce((s, p) => s + calcStr(p), 0);
                        const sumB  = teamB.reduce((s, p) => s + calcStr(p), 0);
                        const total = sumA + sumB || 1;
                        const pA    = sumA / total * 100;
                        const pB    = sumB / total * 100;
                        const eq    = 100 - Math.abs(50 - pA) * 2;

                        const eqColor = eq >= 80 ? '#34d399' : eq >= 60 ? '#fbbf24' : eq >= 40 ? '#fb923c' : '#f87171';
                        const eqLabel = eq >= 80 ? '⚖️ Muy parejos' : eq >= 60 ? '🟡 Bastante parejos' : eq >= 40 ? '🟠 Algo desparejados' : '🔴 Muy desparejados';

                        const posOf = (team) => {
                            const c = { ARQ:0, DEF:0, MED:0, DEL:0 };
                            team.forEach(p => { if (c[p.position] !== undefined) c[p.position]++; });
                            return c;
                        };
                        const posA = posOf(teamA), posB = posOf(teamB);

                        return (
                            <div className="mt-3 sm:mt-5 pt-3 sm:pt-4 border-t border-stone-700 px-1 sm:px-0">

                                {/* Encabezado + barra: solo admin */}
                                {isAdmin && (
                                    <>
                                        <div className="flex items-center justify-between mb-2">
                                            <p className="text-stone-400 font-bold text-[9px] sm:text-xs uppercase tracking-wider flex items-center gap-1">
                                                <i className="ph-fill ph-scales"></i> Equidad de Equipos
                                            </p>
                                            <span className="font-black text-sm sm:text-lg" style={{ color: eqColor }}>{eq.toFixed(0)}% <span className="text-[8px] sm:text-[10px] font-semibold">{eqLabel}</span></span>
                                        </div>
                                        <div className="flex rounded-full overflow-hidden h-5 sm:h-6 mb-3 shadow-inner border border-stone-700">
                                            <div className="bg-blue-600 flex items-center justify-center text-white font-black text-[9px] sm:text-xs transition-all duration-700 ease-in-out" style={{ width: `${pA}%` }}>
                                                {pA > 12 && `${pA.toFixed(0)}%`}
                                            </div>
                                            <div className="bg-red-600 flex items-center justify-center text-white font-black text-[9px] sm:text-xs transition-all duration-700 ease-in-out" style={{ width: `${pB}%` }}>
                                                {pB > 12 && `${pB.toFixed(0)}%`}
                                            </div>
                                        </div>
                                    </>
                                )}

                                {/* Balance por posición: siempre visible */}
                                <div className="grid grid-cols-4 gap-1 sm:gap-1.5">
                                    {['ARQ','DEF','MED','DEL'].map(pos => {
                                        const diff = Math.abs((posA[pos]||0) - (posB[pos]||0));
                                        const unbal = isAdmin && diff >= 2;
                                        return (
                                            <div key={pos} className={`bg-stone-900 rounded-lg p-1 sm:p-2 text-center border ${unbal ? 'border-orange-500/60' : 'border-stone-700/60'}`}>
                                                <p className={`text-[7px] sm:text-[9px] font-black uppercase tracking-wider mb-0.5 ${unbal ? 'text-orange-400' : 'text-stone-500'}`}>{pos}</p>
                                                <div className="flex items-center justify-center gap-1">
                                                    <span className="text-blue-400 font-black text-[9px] sm:text-sm">{posA[pos]||0}</span>
                                                    <span className="text-stone-600 text-[8px]">|</span>
                                                    <span className="text-red-400 font-black text-[9px] sm:text-sm">{posB[pos]||0}</span>
                                                </div>
                                                {unbal && <p className="text-[6px] sm:text-[7px] text-orange-400 mt-0.5">⚠ desbal.</p>}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        );
                    })()}
                    {/* ────────────────────────────────────────────────── */}

                    {!isCompleted && unassigned.length > 0 && (
                        <div className="mt-4 sm:mt-6 pt-3 sm:pt-4 border-t border-stone-700 px-1 sm:px-0">
                            <h4 className="text-stone-400 font-medium mb-2 text-xs sm:text-sm">Sin equipo:</h4>
                            <div className="flex flex-wrap gap-1 sm:gap-2">
                                {unassigned.map(p => (
                                    <div key={p.id} className="bg-stone-900 border border-stone-700 px-2 sm:px-3 py-1 sm:py-1.5 rounded-full flex items-center gap-1 sm:gap-2 text-[10px] sm:text-sm">
                                        <span className="text-stone-300">{p.name} {p.lastName?.charAt(0)}.</span>
                                        {isAdmin && (
                                            <div className="flex gap-0.5 sm:gap-1 border-l border-stone-700 pl-1 sm:pl-2" data-html2canvas-ignore="true">
                                                <button onClick={() => handleAssignTeam(p.id, 'A')} className="text-blue-400 font-bold px-1 hover:bg-blue-900/30 rounded">A</button>
                                                <button onClick={() => handleAssignTeam(p.id, 'B')} className="text-red-400 font-bold px-1 hover:bg-red-900/30 rounded">B</button>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </section>
            );
        }

        // --- LEADERBOARD ---
        function LeaderboardSection({ computedPlayers, isAdmin }) {
            const [sortBy, setSortBy] = useState('asistencia');

            const rankedPlayers = computedPlayers.map(p => {
                const percentage = p.attendancePerc || 0;
                let tier = 'C', tierColor = 'text-red-400', tierBg = 'bg-red-400/10 border-red-400/20';
                if (percentage >= 75) { tier = 'S'; tierColor = 'text-pitch-400'; tierBg = 'bg-pitch-400/10 border-pitch-400/20'; }
                else if (percentage >= 50) { tier = 'A'; tierColor = 'text-blue-400'; tierBg = 'bg-blue-400/10 border-blue-400/20'; }
                else if (percentage >= 25) { tier = 'B'; tierColor = 'text-gold'; tierBg = 'bg-gold/10 border-gold/20'; }
                return { ...p, tier, tierColor, tierBg };
            });

            const sortedPlayers = [...rankedPlayers].sort((a, b) => {
                if (sortBy === 'asistencia') return b.attendancePerc - a.attendancePerc;
                if (sortBy === 'victorias') return b.winPerc - a.winPerc;
                if (sortBy === 'goles') return b.totalGoals - a.totalGoals;
                if (sortBy === 'alfabetico') return (a.name || '').localeCompare(b.name || '');
                if (sortBy === 'posicion') return (a.position || '').localeCompare(b.position || '');
                return 0;
            });

            return (
                <section className="bg-stone-800 rounded-2xl p-3 sm:p-6 shadow-xl border border-stone-700/50">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                        <h2 className="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
                            <i className="ph-fill ph-ranking text-gold"></i> Ranking Oficial
                        </h2>
                        <div className="flex items-center gap-2 bg-stone-900 border border-stone-600 rounded-lg p-1 w-full sm:w-auto">
                            <i className="ph-fill ph-funnel text-stone-400 pl-2"></i>
                            <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="bg-stone-900 text-sm text-white p-2 outline-none w-full cursor-pointer rounded-md">
                                <option className="bg-stone-900 text-white" value="asistencia">Porcentaje de Asistencia</option>
                                <option className="bg-stone-900 text-white" value="victorias">Porcentaje de Victorias</option>
                                <option className="bg-stone-900 text-white" value="goles">Cantidad de Goles</option>
                                <option className="bg-stone-900 text-white" value="alfabetico">Orden Alfabético</option>
                                <option className="bg-stone-900 text-white" value="posicion">Por Posición en Campo</option>
                            </select>
                        </div>
                    </div>

                    <div className="grid grid-cols-4 gap-1.5 sm:gap-4 mb-6">
                        <div className="bg-stone-900 p-1 sm:p-3 rounded-xl border border-stone-700 text-center flex flex-col justify-center"><span className="text-sm sm:text-2xl font-black text-pitch-400 block sm:mb-1">Tier S</span><span className="text-[8px] sm:text-xs text-stone-400">100%-75%</span></div>
                        <div className="bg-stone-900 p-1 sm:p-3 rounded-xl border border-stone-700 text-center flex flex-col justify-center"><span className="text-sm sm:text-2xl font-black text-blue-400 block sm:mb-1">Tier A</span><span className="text-[8px] sm:text-xs text-stone-400">74%-50%</span></div>
                        <div className="bg-stone-900 p-1 sm:p-3 rounded-xl border border-stone-700 text-center flex flex-col justify-center"><span className="text-sm sm:text-2xl font-black text-gold block sm:mb-1">Tier B</span><span className="text-[8px] sm:text-xs text-stone-400">49%-25%</span></div>
                        <div className="bg-stone-900 p-1 sm:p-3 rounded-xl border border-stone-700 text-center flex flex-col justify-center"><span className="text-sm sm:text-2xl font-black text-red-400 block sm:mb-1">Tier C</span><span className="text-[8px] sm:text-xs text-stone-400">&lt;25%</span></div>
                    </div>

                    <div className="w-full overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="border-b border-stone-700 text-stone-400 text-[8px] sm:text-sm uppercase tracking-wide">
                                    <th className="p-1 sm:p-3 font-semibold w-6 sm:w-12 text-center">#</th>
                                    <th className="p-1 sm:p-3 font-semibold">Chocolatero</th>
                                    <th className="p-1 sm:p-3 font-semibold text-center w-8 sm:w-auto">Pos</th>
                                    <th className="p-1 sm:p-3 font-semibold text-center w-10 sm:w-auto">Tier</th>
                                    <th className="p-1 sm:p-3 font-semibold text-center w-8 sm:w-auto" title="Goles Totales">Gol</th>
                                    <th className="p-1 sm:p-3 font-semibold text-center w-10 sm:w-auto" title="% de Partidos Ganados">Win%</th>
                                    <th className="p-1 sm:p-3 font-semibold text-right w-10 sm:w-auto whitespace-nowrap">% ASIS</th>
                                </tr>
                            </thead>
                            <tbody>
                                {sortedPlayers.map((player, index) => (
                                    <tr key={player.id} className="border-b border-stone-700/50 hover:bg-stone-700/20 transition-colors">
                                        <td className="p-1 sm:p-3 text-center">
                                            <span className={`inline-flex items-center justify-center w-4 h-4 sm:w-6 sm:h-6 rounded-full text-[10px] sm:text-xs font-bold ${index < 3 && sortBy==='asistencia' ? 'bg-gold/20 text-gold' : 'text-stone-500'}`}>{index + 1}</span>
                                        </td>
                                        <td className="p-1 sm:p-3">
                                            <div className="flex items-center gap-1 sm:gap-2">
                                                <PlayerAvatar player={player} className="w-8 h-8 text-xs hidden sm:flex" />
                                                <span className="font-semibold text-stone-200 text-[11px] sm:text-base truncate max-w-[75px] sm:max-w-none block">{formatPlayerName(player, true)}</span>
                                            </div>
                                        </td>
                                        <td className="p-1 sm:p-3 text-center">
                                            {player.position ? <span className="text-[8px] sm:text-[10px] font-bold text-stone-400 bg-stone-800 px-1 py-0.5 sm:px-2 sm:py-1 rounded">{player.position}</span> : '-'}
                                        </td>
                                        <td className="p-1 sm:p-3 text-center">
                                            <span className={`inline-block px-1 py-0.5 sm:px-3 sm:py-1 rounded border ${player.tierBg} ${player.tierColor} font-black text-[9px] sm:text-sm w-full sm:w-12 text-center`}>{player.tier}</span>
                                        </td>
                                        <td className="p-1 sm:p-3 text-center font-bold text-stone-300 text-[11px] sm:text-base">{player.totalGoals}</td>
                                        <td className="p-1 sm:p-3 text-center text-[10px] sm:text-sm font-semibold text-blue-300">{player.winPerc.toFixed(0)}%</td>
                                        <td className="p-1 sm:p-3 text-right">
                                            <span className={`font-bold text-[10px] sm:text-base ${player.tierColor}`}>{player.attendancePerc.toFixed(0)}%</span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </section>
            );
        }

        // --- ADMIN PANEL ---
        function AdminPanel({ dbState, updateState, computedPlayers, handleExportDB, handleImportDB }) {
            const [filterTag, setFilterTag] = useState('all');
            const [isAddingPlayer, setIsAddingPlayer] = useState(false);
            const [editingPlayerId, setEditingPlayerId] = useState(null);
            const [playerForm, setPlayerForm] = useState({ name: '', lastName: '', alias: '', phone: '', photoUrl: '', username: '', password: '', baseMatches: 0, basePoints: 0, baseGoals: 0, baseWins: 0, position: '' });
            const [playerToDelete, setPlayerToDelete] = useState(null);
            const [formError, setFormError] = useState("");
            const [cropFile, setCropFile] = useState(null);

            // Escuchar Ctrl+V para pegar imagen mientras el modal de jugador está abierto
            useEffect(() => {
                if (!isAddingPlayer) return;
                const handler = (e) => {
                    const items = e.clipboardData?.items;
                    if (!items) return;
                    for (const item of items) {
                        if (item.type.startsWith('image/')) {
                            setCropFile(item.getAsFile());
                            e.preventDefault();
                            break;
                        }
                    }
                };
                document.addEventListener('paste', handler);
                return () => document.removeEventListener('paste', handler);
            }, [isAddingPlayer]);

            const players = dbState?.players || [];

            const playersWithTags = computedPlayers.map(p => {
                let tags = [];
                if (!p.name) tags.push({id: 'missing_name', label: 'Falta Nombre', color: 'bg-red-900/40 text-red-300 border-red-700/50'});
                if (!p.lastName) tags.push({id: 'missing_lastName', label: 'Falta Apellido', color: 'bg-amber-900/40 text-amber-300 border-amber-700/50'});
                if (!p.phone) tags.push({id: 'missing_phone', label: 'Falta Celular', color: 'bg-orange-900/40 text-orange-300 border-orange-700/50'});
                if (!p.username) tags.push({id: 'missing_user', label: 'Falta Usuario', color: 'bg-yellow-900/40 text-yellow-300 border-yellow-700/50'});
                if (!p.password) tags.push({id: 'missing_pass', label: 'Falta Clave', color: 'bg-yellow-900/40 text-yellow-300 border-yellow-700/50'});
                if (tags.length === 0) tags.push({id: 'complete', label: 'Datos Completos', color: 'bg-pitch-900/40 text-pitch-400 border-pitch-700/50'});
                return { ...p, tags };
            });

            const filteredPlayers = filterTag === 'all' ? playersWithTags : playersWithTags.filter(p => p.tags.some(t => t.id === filterTag));

            const handleSavePlayer = () => {
                if (!playerForm.name) { setFormError("⚠️ El Nombre es obligatorio."); return; }
                if (playerForm.username) {
                    const isDuplicate = players.some(p => p.username === playerForm.username && p.id !== editingPlayerId);
                    if(isDuplicate) { setFormError("⚠️ Este nombre de usuario ya está en uso."); return; }
                }
                setFormError("");
                const newPlayers = [...players];
                if (editingPlayerId) {
                    const idx = newPlayers.findIndex(p => p.id === editingPlayerId);
                    if (idx !== -1) newPlayers[idx] = { ...newPlayers[idx], ...playerForm };
                } else {
                    newPlayers.push({ id: Date.now().toString(), ...playerForm, baseMatches: Number(playerForm.baseMatches)||0, basePoints: Number(playerForm.basePoints)||0, baseGoals: Number(playerForm.baseGoals)||0, baseWins: Number(playerForm.baseWins)||0 });
                }
                updateState({ ...dbState, players: newPlayers });
                setIsAddingPlayer(false); setEditingPlayerId(null);
            };

            const confirmDeletePlayer = () => {
                if (!playerToDelete) return;
                updateState({ ...dbState, players: players.filter(p => p.id !== playerToDelete) });
                setPlayerToDelete(null);
            };

            const editPlayer = (pId) => {
                const rawP = players.find(x => x.id === pId);
                setPlayerForm({...rawP}); setEditingPlayerId(pId); setIsAddingPlayer(true);
            };

            return (
                <section className="bg-stone-800 border-2 border-choco-600 rounded-2xl p-3 sm:p-6 shadow-2xl relative overflow-hidden">
                    <div className="absolute top-0 right-0 bg-choco-600 text-white text-xs font-bold px-3 py-1 rounded-bl-lg z-10">MODO ADMIN</div>
                    <h2 className="text-base sm:text-2xl font-bold text-white flex items-center gap-2 mb-3 sm:mb-6 mt-1 sm:mt-2"><i className="ph-fill ph-database text-choco-400"></i> Base de Datos</h2>

                    <div className="grid grid-cols-2 gap-3 sm:gap-6">
                        <div className="bg-stone-900 rounded-xl p-2.5 sm:p-5 border border-stone-700 flex flex-col justify-between">
                            <div>
                                <h3 className="text-white font-semibold mb-1 sm:mb-2 flex items-center gap-1.5 text-xs sm:text-base"><i className="ph-fill ph-files"></i> Respaldos</h3>
                                <p className="text-[10px] sm:text-sm text-stone-400 mb-2 sm:mb-4 hidden sm:block">Exporta o importa toda la base de datos.</p>
                            </div>
                            <div className="flex gap-1.5 sm:gap-2">
                                <button onClick={handleExportDB} className="flex-1 bg-stone-700 hover:bg-stone-600 py-1.5 sm:py-2 rounded-lg text-white font-semibold text-[10px] sm:text-sm transition-colors flex items-center justify-center gap-1 sm:gap-2"><i className="ph ph-download-simple"></i> <span className="hidden sm:inline">Exportar</span><span className="sm:hidden">Exp.</span></button>
                                <label className="flex-1 bg-choco-700 hover:bg-choco-600 cursor-pointer py-1.5 sm:py-2 rounded-lg text-white font-semibold text-[10px] sm:text-sm transition-colors flex items-center justify-center gap-1 sm:gap-2">
                                    <i className="ph ph-upload-simple"></i> <span className="hidden sm:inline">Importar</span><span className="sm:hidden">Imp.</span> <input type="file" accept=".json" className="hidden" onChange={handleImportDB} />
                                </label>
                            </div>
                        </div>

                        <div className="bg-stone-900 rounded-xl p-2.5 sm:p-5 border border-stone-700">
                            <div className="flex flex-col gap-1.5 sm:gap-3 mb-2 sm:mb-4 border-b border-stone-800 pb-2 sm:pb-3">
                                <h3 className="text-white font-semibold text-xs sm:text-base">Registrados: <span className="text-pitch-400">{filteredPlayers.length}</span></h3>
                                <div className="flex gap-1 sm:gap-2 w-full">
                                    <select value={filterTag} onChange={e => setFilterTag(e.target.value)} className="bg-stone-800 border border-stone-600 rounded p-1 text-[9px] sm:text-xs text-white outline-none flex-1 min-w-0">
                                        <option value="all">Todas</option>
                                        <option value="complete">✅ Completos</option>
                                        <option value="missing_name">❌ Nombre</option>
                                        <option value="missing_lastName">❌ Apellido</option>
                                        <option value="missing_phone">❌ Celular</option>
                                        <option value="missing_user">❌ Usuario</option>
                                        <option value="missing_pass">❌ Clave</option>
                                    </select>
                                    <button onClick={() => { setPlayerForm({name:'',lastName:'',alias:'',phone:'',photoUrl:'',username:'',password:'',baseMatches:0,basePoints:0,baseGoals:0,baseWins:0,position:''}); setEditingPlayerId(null); setIsAddingPlayer(true); }} className="bg-pitch-600 hover:bg-pitch-500 text-white text-[9px] sm:text-xs px-2 py-1 rounded font-bold transition-colors shrink-0">
                                        + Añadir
                                    </button>
                                </div>
                            </div>
                            <div className="max-h-40 sm:max-h-64 overflow-y-auto space-y-1 sm:space-y-2 pr-1 sm:pr-2 custom-scrollbar">
                                {filteredPlayers.map(p => (
                                    <div key={p.id} className="flex flex-row items-center bg-stone-800 p-1 sm:p-3 rounded-lg border border-stone-700 gap-1 sm:gap-2">
                                        <PlayerAvatar player={p} className="w-5 h-5 sm:w-8 sm:h-8 text-[8px] sm:text-xs shrink-0" />
                                        <div className="min-w-0 flex-1 overflow-hidden">
                                            <span className="font-medium text-stone-200 block text-[8px] sm:text-sm leading-tight">{p.name}{p.lastName ? ` ${p.lastName}` : ''}</span>
                                            <div className="flex flex-nowrap gap-0.5 mt-0.5 overflow-hidden">
                                                {p.tags.map(t => <span key={t.id} className={`text-[6px] sm:text-[9px] px-0.5 sm:px-1 py-0.5 rounded border whitespace-nowrap ${t.color}`}>{t.label}</span>)}
                                            </div>
                                        </div>
                                        <div className="flex gap-0.5 sm:gap-2 shrink-0">
                                            <button onClick={() => editPlayer(p.id)} className="text-stone-400 hover:text-white bg-stone-700 hover:bg-stone-600 p-0.5 sm:p-1.5 rounded transition-colors"><i className="ph ph-pencil-simple text-[9px] sm:text-sm"></i></button>
                                            <button onClick={() => setPlayerToDelete(p.id)} className="text-red-400 hover:text-red-300 bg-red-900/30 hover:bg-red-900/60 p-0.5 sm:p-1.5 rounded transition-colors"><i className="ph ph-trash text-[9px] sm:text-sm"></i></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <Modal isOpen={isAddingPlayer} onClose={() => { setIsAddingPlayer(false); setFormError(""); }} title={editingPlayerId ? "Editar Chocolatero" : "Nuevo Chocolatero"}>
                        <div className="space-y-4 max-h-[70vh] overflow-y-auto custom-scrollbar pr-2">
                            {formError && <div className="bg-red-900/20 text-red-400 text-sm p-3 rounded-lg border border-red-700/50">{formError}</div>}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div><label className="block text-sm text-stone-400 mb-1">Nombre *</label><input type="text" value={playerForm.name} onChange={e => setPlayerForm({...playerForm, name: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white focus:border-pitch-500 outline-none" /></div>
                                <div><label className="block text-sm text-stone-400 mb-1">Apellido</label><input type="text" value={playerForm.lastName} onChange={e => setPlayerForm({...playerForm, lastName: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white focus:border-pitch-500 outline-none" /></div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div><label className="block text-sm text-stone-400 mb-1">Alias (Apodo)</label><input type="text" value={playerForm.alias} onChange={e => setPlayerForm({...playerForm, alias: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white focus:border-pitch-500 outline-none" /></div>
                                <div><label className="block text-sm text-stone-400 mb-1">Celular / WA</label><input type="text" value={playerForm.phone} onChange={e => setPlayerForm({...playerForm, phone: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white focus:border-pitch-500 outline-none" /></div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm text-stone-400 mb-1">Posición Frecuente</label>
                                    <select value={playerForm.position} onChange={e => setPlayerForm({...playerForm, position: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white focus:border-pitch-500 outline-none text-sm">
                                        <option value="">No definida</option>
                                        <option value="ARQ">Arquero (ARQ)</option>
                                        <option value="DEF">Defensa (DEF)</option>
                                        <option value="MED">Medio (MED)</option>
                                        <option value="DEL">Delantero (DEL)</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm text-stone-400 mb-1">Foto de Perfil</label>
                                    <div className="flex items-center gap-1.5">
                                        {playerForm.photoUrl && <img src={playerForm.photoUrl} className="w-8 h-8 rounded-full object-cover shrink-0" />}
                                        <input type="file" accept="image/*" onChange={e => { if(e.target.files[0]) setCropFile(e.target.files[0]); e.target.value = ''; }} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-1.5 text-white outline-none text-xs cursor-pointer file:hidden" />
                                        <button type="button" onClick={async () => {
                                            try {
                                                const items = await navigator.clipboard.read();
                                                for (const item of items) {
                                                    const t = item.types.find(x => x.startsWith('image/'));
                                                    if (t) { const blob = await item.getType(t); setCropFile(new File([blob],'pasted.png',{type:t})); break; }
                                                }
                                            } catch { alert('Presiona Ctrl+V en cualquier parte de esta ventana para pegar.'); }
                                        }} className="shrink-0 bg-stone-700 hover:bg-stone-600 text-stone-300 px-2 py-1.5 rounded-lg text-xs font-semibold transition-colors border border-stone-600" title="Pegar imagen del portapapeles (Ctrl+V)">
                                            📋
                                        </button>
                                        {playerForm.photoUrl && <button onClick={() => setPlayerForm({...playerForm, photoUrl: ''})} className="text-red-400 hover:text-red-300 p-1 shrink-0"><i className="ph ph-trash"></i></button>}
                                    </div>
                                </div>
                            </div>
                            <div className="bg-stone-900/50 p-3 rounded-lg border border-stone-700 mt-2">
                                <p className="text-sm text-pitch-400 font-bold mb-2">Credenciales (Opcional)</p>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div><label className="block text-xs text-stone-400 mb-1">Usuario</label><input type="text" value={playerForm.username} onChange={e => setPlayerForm({...playerForm, username: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white focus:border-pitch-500 outline-none text-sm" /></div>
                                    <div><label className="block text-xs text-stone-400 mb-1">Contraseña</label><input type="text" value={playerForm.password} onChange={e => setPlayerForm({...playerForm, password: e.target.value})} className="w-full bg-stone-900 border border-stone-700 rounded-lg p-2 text-white focus:border-pitch-500 outline-none text-sm" /></div>

                            </div>
